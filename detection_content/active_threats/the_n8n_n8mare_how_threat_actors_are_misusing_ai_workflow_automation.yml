id: PFGSlZ0BFsA9Tj2-pG-0
name: 'The n8n n8mare: How threat actors are misusing AI workflow automation'
created: '2026-04-16T09:11:43Z'
updated: '2026-10-08T12:27:32Z'
summary: Threat actors are abusing the n8n low‑code workflow automation platform to deliver malicious payloads and to fingerprint email recipients. By embedding malicious webhook URLs in phishing emails, they can host executable or MSI installers that install remote‑access tools. The abuse also includes invisible tracking pixels that collect victim data when the email is opened. This campaign demonstrates how legitimate automation services can be weaponized for credential‑free malware delivery.
severity: Medium
investigation: Cisco Talos investigated a series of phishing campaigns from October 2025 to March 2026 that used n8n webhook URLs in emails. The emails presented fake OneDrive links that displayed a CAPTCHA before delivering either a malicious .exe or a malicious MSI. The payloads installed modified Datto or ITarian RMM tools and created scheduled tasks for persistence. Talos also identified fingerprinting attempts using image tags that called n8n webhook URLs with victim identifiers.
response: Alert on detections of n8n webhook URLs in email content or network traffic and isolate affected endpoints. Remove any installed RMM binaries and scheduled tasks, then perform forensic analysis to locate additional persistence mechanisms. Update firewall and proxy rules to restrict access to unauthorized n8n endpoints. Conduct a full IOC sharing cycle with internal and external teams.
mitigation: Detect high volumes of outbound traffic to n8n domains from unexpected internal hosts and monitor for anomalous webhook URL patterns. Block or sandbox URLs that resolve to unknown subdomains of n8n.cloud. Deploy email security solutions that can detect malicious HTML, CAPTCHAs, and tracking pixels. Share IOCs such as webhook URLs and malicious file hashes with threat intel platforms.
