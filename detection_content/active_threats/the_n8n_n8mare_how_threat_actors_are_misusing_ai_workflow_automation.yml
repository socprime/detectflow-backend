attack_flow: |-
  ```mermaid
  graph TB
  %% Class Definitions
  classDef action fill:#99ccff
  classDef tool fill:#ffcc99
  classDef malware fill:#ff9999
  classDef process fill:#ccccff

  %% Nodes
  action_phishing["<b>Action</b> - <b>T1566 Phishing</b>: Threat actors send malicious emails containing n8n webhook URLs to lure victims.<br/><b>Description</b>: Phishing attempts to deliver malicious content via email."]
  class action_phishing action

  tool_webhook["<b>Tool</b> - <b>Name</b>: n8n webhook<br/><b>Description</b>: Custom web endpoint used to deliver payloads."]
  class tool_webhook tool

  action_user_execution["<b>Action</b> - <b>T1204.001 User Execution: Malicious Link</b>: Victim clicks the webhook link, causing the browser to request the URL.<br/><b>Description</b>: User interacts with malicious content."]
  class action_user_execution action

  action_exfil_webhook1["<b>Action</b> - <b>T1567.004 Exfiltration Over Webhook</b>: Webhook returns a malicious HTML page with a CAPTCHA and streams a payload (EXE or MSI) while serving tracking pixels.<br/><b>Description</b>: Uses a web service to deliver and exfiltrate data."]
  class action_exfil_webhook1 action

  malware_payload_exe["<b>Malware</b> - <b>Name</b>: Payload EXE/MSI<br/><b>Description</b>: Executable that runs PowerShell to install a modified RMM tool."]
  class malware_payload_exe malware

  action_powershell["<b>Action</b> - <b>T1059.001 PowerShell</b>: Downloaded executable runs PowerShell commands to configure and install the modified RMM tool.<br/><b>Description</b>: Command and scripting interpreter."]
  class action_powershell action

  malware_rmm["<b>Malware</b> - <b>Name</b>: Modified RMM backdoor<br/><b>Description</b>: Remote monitoring and management tool used for persistence."]
  class malware_rmm malware

  action_service_execution["<b>Action</b> - <b>T1569.002 Service Execution</b>: RMM tool is installed as a Windows service for persistence.<br/><b>Description</b>: Executes via a system service."]
  class action_service_execution action

  action_scheduled_task["<b>Action</b> - <b>T1053 Scheduled Task/Job</b>: A scheduled task is created to ensure the RMM tool runs persistently.<br/><b>Description</b>: Ensures recurring execution."]
  class action_scheduled_task action

  action_msi_execution["<b>Action</b> - <b>T1218.007 Msiexec</b>: Malicious MSI is executed via msiexec to deploy the RMM backdoor.<br/><b>Description</b>: System binary proxy execution."]
  class action_msi_execution action

  action_exfil_webhook2["<b>Action</b> - <b>T1567.004 Exfiltration Over Webhook</b>: Invisible tracking pixel loads the webhook to capture email open events and device information for reconnaissance."]
  class action_exfil_webhook2 action

  %% Connections
  action_phishing -->|delivers| tool_webhook
  tool_webhook -->|triggers| action_user_execution
  action_user_execution -->|leads to| action_exfil_webhook1
  action_exfil_webhook1 -->|delivers| malware_payload_exe
  malware_payload_exe -->|executes| action_powershell
  action_powershell -->|installs| malware_rmm
  malware_rmm -->|persists via| action_service_execution
  action_service_execution -->|creates| action_scheduled_task
  action_scheduled_task -->|supports| action_msi_execution
  action_msi_execution -->|deploys| malware_rmm
  malware_rmm -->|communicates via| action_exfil_webhook2
  ```
