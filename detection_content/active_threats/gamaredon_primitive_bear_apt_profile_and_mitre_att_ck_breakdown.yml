attack_flow: |
  flowchart TD
      step_resource_development["Resource Development: Acquisition of .ru domains, VPS, and legitimate services (Cloudflare, Telegram) for C2 and staging."]
      step_initial_access["T1566.001 - Phishing: Spearphishing Attachment via RAR/ZIP archives and WinRAR path-traversal (CVE-2025-8088)."]
      rules_for_initial_access("<b>Rule Name</b>: Possible CVE-2025-8088 / CVE-2025-6218 (WinRAR Vulnerability) Exploitation Attempt (via file_event)<br/><b>Rule ID</b>: c550cc75-398e-4985-a1e9-5088e126e468")
      step_execution["T1059 - Command and Scripting Interpreter: PowerShell and JavaScript for HTML smuggling; WMI and Native API for fingerprinting."]
      step_persistence["T1547.001 - Boot or Logon Autostart Execution: Registry Run keys, Startup folder, Scheduled Tasks, and weaponized Normal.dotm templates."]
      rules_for_persistence("<b>Rule Name</b>: Suspicious Binary / Scripts in Autostart Location (via file_event)<br/><b>Rule ID</b>: d5fe94b1-93ec-4c40-9acc-0c7de41a24c3")
      step_stealth["T1027 - Obfuscated Files or Information: HTML Smuggling, fileless registry storage, and environmental keying via volume serial number."]
      step_credential_access["T1555 - Credentials from Password Stores: Stealing web session cookies and browser data using PteroSteal."]
      step_discovery["T1082 - Software Discovery: Using WMI to identify security software."]
      step_lateral_movement["T1566 - Lateral Movement: Tainting shared content and replication via PteroLNK on removable media."]
      step_collection["T1005 - Data from Local System: Targeting documents, desktop, downloads, and network shares; screen capture."]
      step_exfiltration["T1041 - Exfiltration Over C2: HTTP/HTTPS; T1567 - Exfiltration Over Web Service: write.as, MEGA (via rclone), and Tor (cURL)."]
      rules_for_exfiltration("<b>Rule Name</b>: Possible Dynamic DNS Service Was Contacted (via dns)<br/><b>Rule ID</b>: 012f09b6-b6b1-4421-928f-0ab59b63251a")
