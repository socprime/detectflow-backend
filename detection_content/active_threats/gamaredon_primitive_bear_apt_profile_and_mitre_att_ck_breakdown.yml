      step_initial_access -.->|detected_by| rules_for_initial_access
      step_execution -->|leads_to| step_persistence
      step_persistence -->|leads_to| step_stealth
      step_persistence -.->|detected_by| rules_for_persistence
      step_stealth -->|leads_to| step_credential_access
      step_credential_access -->|leads_to| step_discovery
      step_discovery -->|leads_to| step_lateral_movement
      step_lateral_movement -->|leads_to| step_collection
      step_collection -->|leads_to| step_exfiltration
