name: Gamaredon (Primitive Bear) APT Profile and MITRE ATT&CK Breakdown
created: '2026-07-13T09:03:05Z'
updated: '2026-10-09T09:25:04Z'
summary: Gamaredon is a Russia-aligned advanced persistent threat group active since 2013, attributed to the Russian FSB. The group focuses on cyber espionage and data theft, primarily targeting Ukrainian government and defense sectors. They utilize custom malware families such as GammaLoad and GammaSteel alongside various obfuscation and persistence techniques.
severity: Critical
investigation: The report details historical campaigns from 2013 to 2025, highlighting a shift towards using Cloudflare Workers, Telegram APIs, and exploiting WinRAR vulnerabilities. It examines the group's evolution from custom VBScript droppers to more complex PowerShell-based infostealers and mobile spyware.
response: Upon detection, responders should isolate affected hosts, particularly those showing signs of GammaSteel or Ptero* malware activity. Investigate registry persistence keys, check for unauthorized scheduled tasks, and conduct a thorough hunt for unusual outbound connections to Cloudflare or Telegram-based infrastructure.
mitigation: Mitigation strategies include patching WinRAR to address CVE-2025-8088 and monitoring for suspicious PowerShell execution. Organizations should implement strict controls over removable media, monitor for unusual scheduled tasks, and validate security controls against the group's known TTPs using simulation platforms.
