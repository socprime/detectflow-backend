id: PnqlSBtqTSad
name: Suspicious Scheduled Task Under System User (via cmdline)
body: |-
  title: Suspicious Scheduled Task Under System User (via cmdline)
  id: 4790466e-9bfa-4fe2-9823-1663ca19123e
  description: Detects the suspicious scheduled task creation under SYSTEM as a system User
  status: stable
  author: SOC Prime Team
  references:
      - https://thehackernews.com/2026/06/new-sharkloader-malware-deploys-cobalt.html
      - https://any.run/cybersecurity-blog/brazilian-banking-phishing-campaign/
      - https://security.googlecloudcommunity.com/community-blog-42/finding-malware-dirtybulk-and-friends-usb-infections-to-fuel-cybercriminal-coinmining-operations-5552
      - https://www.security.com/threat-intelligence/ukraine-russia-attacks
      - https://unit42.paloaltonetworks.com/cybercriminals-attack-financial-sector-across-africa/
      - https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns
      - https://osintteam.blog/you-dirty-rat-asyncrat-malware-analysis-e2b908188db1
      - https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/stopransomware-bianlian-ransomware-group
      - https://thedfirreport.com/2023/12/18/lets-opendir-some-presents-an-analysis-of-a-persistent-actors-activity/
      - https://www.infosecurity-magazine.com/news/signature-techniques-of-asian-apt/
      - https://unit42.paloaltonetworks.com/agonizing-serpens-targets-israeli-tech-higher-ed-sectors/
      - https://www.microsoft.com/en-us/security/blog/2023/06/14/cadet-blizzard-emerges-as-a-novel-and-distinct-russian-threat-actor/
      - https://thedfirreport.com/2023/03/06/2022-year-in-review/
      - https://thehackernews.com/2022/09/north-korean-hackers-spotted-using-new.html
      - https://research.checkpoint.com/2025/ink-dragons-relay-network-and-offensive-operation/
  tags:
      - attack.execution
      - attack.t1053.005
  logsource:
      product: windows
      category: process_creation
  detection:
      selection:
          Image|endswith: 'schtasks.exe'
          CommandLine|contains: 'create'
      selection_privs:
          CommandLine|contains:
              - ' SYSTEM' #https://unit42.paloaltonetworks.com/cybercriminals-attack-financial-sector-across-africa/; https://research.checkpoint.com/2025/ink-dragons-relay-network-and-offensive-operation/
              #- ' SYSTEM ' #schtasks /Create /Tn \Microsoft\Windows\Registration\CRMLog /sc daily /st 11:50 /tr "С:\Windows\Registration\crml.exe" /ru system /f
              #- 'AUTHORITY'
              - ' highest ' #/c schtasks /create /f /sc onlogon /rl highest /tn "<TASK>" /tr "<EXECUTABLE>" & exit; https://www.security.com/threat-intelligence/ukraine-russia-attacks; https://security.googlecloudcommunity.com/community-blog-42/finding-malware-dirtybulk-and-friends-usb-infections-to-fuel-cybercriminal-coinmining-operations-5552
      filters:
          CommandLine|contains:
              - ':\Program Files'
      condition: (selection and selection_privs) and not filters
  falsepositives:
      - Administrative activity
      - The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  level: medium
level: medium
created: '2022-09-30T21:29:55Z'
updated: '2026-07-21T11:51:58.688000Z'
