  logsource:
      category: process_creation
      product: windows
  detection:
      selection_img:
          Image|endswith:
              - '.exe'
              - '.tmp'
              - '.src'
      selection:
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Pp][Ss]1[^a-zA-Z0-9].*' #.ps1; https://asec.ahnlab.com/en/87398/; https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-203a; https://asec.ahnlab.com/en/93151/; https://cert.gov.ua/article/6288271; https://asec.ahnlab.com/en/93855/; https://www.huntress.com/blog/defcon-phishing-google-doc-malware; https://www.malwarebytes.com/blog/threat-intel/2026/09/kothamine-malware-uses-tailscales-tailcat-to-evade-network-detection; https://www.reversinglabs.com/blog/how-rl-mapped-a-midnight-blizzard-linked-campaign-from-two-hashes
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Vv][Bb][Ee][^a-zA-Z0-9].*' #.vbe
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Vv][Bb][Ss][^a-zA-Z0-9].*' #.vbs; https://asec.ahnlab.com/en/87398/; https://socradar.io/cve-2025-53690-sitecore-deployments-weepsteel-malware/; https://www.huntress.com/blog/rogue-screenconnect-installations; https://thehackernews.com/2026/10/clickfix-smuggles-payloads-through.html
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Jj][Ss][Ee][^a-zA-Z0-9].*' #.jse
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Bb][Aa][Tt][^a-zA-Z0-9].*' #.bat #https://labs.withsecure.com/publications/crazyhunter-ransomware; https://asec.ahnlab.com/en/94995/; https://www.forescout.com/blog/from-clickfix-to-c2-comparative-analysis-of-two-malware-loaders/
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,3}\.[Cc][Mm][Dd][^a-zA-Z0-9].*' #.cmd
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,2}\.[Pp][Yy][^a-zA-Z0-9].*' # .py
          - CommandLine|re: '.*[^a-zA-Z0-9\.\_\-][a-zA-Z0-9\.\_\-]{1,2}\.[Aa][Uu]3[^a-zA-Z0-9].*' # .au3
      filters:
          - ParentImage|endswith:
              - 'music\updater\updaterold.exe' #cmd.exe /s /c ""C:\Users\XXX~1\AppData\Local\Temp\TMP169~2.BAT""
              - 'FWUpdateTool.exe'
              - 'nssm.exe'
              #- 'svchost.exe'
              #- 'Tomcat9.0.64.exe'
              - 'gpscript.exe'
              - 'MyQ.exe'
              - 'CitrixReceiverUpdater.exe'
              - 'Code.exe'
              - 'node.exe'
              - 'h21arcbackup.exe'
              - 'AWProcessCommands.exe'
              - 'FreeC.exe'
              - 'ADPClientService.exe'
              #- 'services.exe'
          - CommandLine|contains:
              - 'vcredist'
              - 'Tomcat'
              - 'SAP740Logon'
              - 'JavaHMS'
              - 'Newgen\Utilities'
              - '\SAP\'
              - 'anaplan-connect-'
              - 'nodejs'
              - 'HMS.bat' # Common administrative scripts
              - 'OmniDocs'
              - 'apache\scripts\ctl.bat'
          - CommandLine|contains|all:
              - 'MMA.ps1' # Common administrative scripts + GPO.
              - 'sysvol'
      condition: (selection and selection_img) and not filters
  falsepositives:
      - filtering required
  level: medium
