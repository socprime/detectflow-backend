  logsource:
      category: process_creation
      product: windows
  detection:
      selection_scope_process_creation:
          ParentImage|contains: '.exe' #to avoide possible match with image_load, etc.
      selection:
          Image|endswith:
              - 'chcp.com'
              - 'whoami.exe' #https://cert.gov.ua/article/6284730; https://www.security.com/threat-intelligence/ukraine-russia-attacks; https://www.attackiq.com/2025/11/14/sandworm/; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-gogitter-gitshellpad-and-goshell; https://www.picussecurity.com/resource/blog/t1059-003-windows-command-shell; https://asec.ahnlab.com/en/92988/
              - 'wmic.exe'
              - '\net.exe' #https://www.attackiq.com/2025/11/14/sandworm/; https://blog.talosintelligence.com/uat-8837/; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-gogitter-gitshellpad-and-goshell; https://blog.talosintelligence.com/uat-8099-new-persistence-mechanisms-and-regional-focus/; https://cert.pl/en/posts/2026/02/fake-captcha-in-action/; https://www.recordedfuture.com/research/graycharlie-hijacks-law-firm-sites-suspected-supply-chain-attack; https://thedfirreport.com/2026/02/23/apache-activemq-exploit-leads-to-lockbit-ransomware/; https://www.veracode.com/blog/malicious-npm-package-hiding-in-plain-pixels/; https://blog.deception.pro/blog/clickfix-hok-velvet-tempest-termite; https://detect.fyi/playbook-hunting-chinese-apt-379a6b950492; https://www.bleepingcomputer.com/news/security/how-a-brute-force-attack-unmasked-a-ransomware-infrastructure-network/; https://www.intel471.com/blog/cve-2026-1731-finding-a-critical-rce-in-an-age-of-ai-driven-vulnerability-research
              - 'net1.exe' #https://www.recordedfuture.com/research/graycharlie-hijacks-law-firm-sites-suspected-supply-chain-attack; https://www.bleepingcomputer.com/news/security/how-a-brute-force-attack-unmasked-a-ransomware-infrastructure-network/
              - 'dsquery.exe' #https://cert.gov.ua/article/6284730; https://www.picussecurity.com/resource/blog/apt41-cyber-attacks-history-operations-and-full-ttp-analysis; https://blog.talosintelligence.com/uat-8837/; https://www.picussecurity.com/resource/blog/hunters-international-ransomware
              - 'dsget.exe' #dsget.exe user -samid -display -email -upn; https://blog.talosintelligence.com/uat-8837/
          CommandLine|contains:
              - '-filter'
              - '-limit' #dsquery.exe user -limit 0; https://blog.talosintelligence.com/uat-8837/
              - '2>&1' #cmd /c "cd /d "C:/<path>/jboss-4.2.3.GA/bin/"&net user" 2>&1
              - '/all' # https://hunt.io/blog/iranian-nexus-oman-government-intrusion; https://www.security.com/threat-intelligence/iran-seedworm-electronics; https://www.rapid7.com/blog/post/tr-it-support-dissecting-modelorat-campaign-microsoft-teams-compromise/; https://blog.deception.pro/blog/clickfix-spacex1337-hok-2026; https://expel.com/blog/synkloader-when-you-throw-in-everything-but-the-kitchen-sink/; https://www.microsoft.com/en-us/security/blog/2026/09/02/impersonating-it-support-threat-actors-turn-remote-session-into-enterprise-wide-access/; https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets
              - '-all'
              - '/upn'
              - '/fqdn'
              - 'useraccount'
              - 'user' #https://cert.gov.ua/article/6284730; https://thedfirreport.com/2025/11/17/cats-got-your-files-lynx-ransomware/; https://www.intel471.com/blog/cve-2026-1731-finding-a-critical-rce-in-an-age-of-ai-driven-vulnerability-research; https://www.picussecurity.com/resource/blog/t1071-001-web-protocols; https://www.picussecurity.com/resource/blog/unc1549-ttps-iranian-apt-targeting-aerospace-and-defense; https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1
              - 'group' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://www.elastic.co/security-labs/solarwinds-whd-exploitation; https://detect.fyi/playbook-hunting-chinese-apt-379a6b950492; https://www.intel471.com/blog/cve-2026-1731-finding-a-critical-rce-in-an-age-of-ai-driven-vulnerability-research; https://www.securonix.com/blog/deepdoor-python-backdoor-and-credential-stealer/; https://reliaquest.com/blog/threat-spotlight-clickfix-evolves-with-pysoxy-proxying
              - 'accounts'
              - 'localgroup'
              - 'domain' #https://www.huntress.com/blog/clickfix-matanbuchus-astarionrat-analysis
              - '/priv' # https://www.huntress.com/blog/nightmare-eclipse-intrusion; https://reliaquest.com/blog/threat-spotlight-reliaquests-agentic-ai-uncovers-new-china-linked-cluster-op-512; https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/
              - 'ds_user'
              - 'ds_group'
              - 'ds_computer'
              #- '/domain'
              - '/dom' #https://unit42.paloaltonetworks.com/cybercriminals-attack-financial-sector-across-africa/; https://www.security.com/threat-intelligence/ukraine-russia-attacks; https://www.zscaler.com/blogs/security-research/c2looper-new-backdoor-likely-tied-ransomware-github-c2; https://www.security.com/threat-intelligence/node-js-returns-ransomware
              - '/add'
              #- '/delete' #FPs in big env.
              - '/active' #https://thehackernews.com/2026/04/lotus-wiper-malware-targets-venezuelan.html
              - '/expires'
              - '/passwordreq'
              - '/scriptpath'
              - '/times' #https://thehackernews.com/2026/04/lotus-wiper-malware-targets-venezuelan.html
              - '/workstations'
              - 'site' #https://www.picussecurity.com/resource/blog/apt41-cyber-attacks-history-operations-and-full-ttp-analysis
              - 'session' #https://www.picussecurity.com/resource/blog/funksec-raas-operations-hacktivism-meets-cybercrime; https://www.derp.ca/research/interlock-tooling-teardown/; https://www.esentire.com/blog/etherrat-sys-info-module-c2-on-ethereum-etherhiding-target-selection-cdn-like-beacons; https://zenox.ai/en/lofystealer-malware-mirando-jogadores-de-minecraft/
      selection_ps:
          CommandLine|contains:
              - 'Get-LocalGroup'
              - 'Get-LocalGroupMember' # https://zerobec.com/blog/operation-bluedash-multi-rmm-workplace-phishing
              - 'Get-LocalUser' #https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns
              - 'Microsoft.ActiveDirectory.Management.dll'
      selection_rare_images:
          Image|endswith:
              - 'quser.exe' #https://unit42.paloaltonetworks.com/cybercriminals-attack-financial-sector-across-africa/; https://blog.talosintelligence.com/uat-8837/
              - 'qwinsta.exe' #https://thehackernews.com/2026/04/lotus-wiper-malware-targets-venezuelan.html
              - 'ldifde.exe' #ldifde.exe -f c:\windows\temp\.txt -p subtree; https://detect.fyi/playbook-hunting-chinese-apt-379a6b950492; https://hackers-arise.com/digital-forensics-hunting-chinese-apts-abusing-native-windows-tools/
              - 'csvde.exe' #https://social.technet.microsoft.com/wiki/contents/articles/2113.comma-separated-value-directory-exchange-csvde-utility.aspx
              - 'whoami.exe' #https://blog.talosintelligence.com/uat-8837/; https://www.picussecurity.com/resource/blog/notepad-supply-chain-attack-chrysalis-backdoor
              - 'klist.exe'
      filter_chain_1:
          ParentImage|endswith: 'powershell.exe'
          Image|endswith: 'net.exe'
          CommandLine|endswith: 'accounts'
      filter_chain_2:
          ParentImage|endswith: 'net.exe'
          Image|endswith: 'net1.exe'
          CommandLine|endswith: 'accounts'
      filter_chain_3:
          ParentImage|endswith: 'SRE.exe'
          Image|endswith: 'cmd.exe'
          CommandLine|endswith: 'user'
      filter_chain_4:
          ParentImage|endswith: 'quser.exe'
          Image|endswith: 'quser.exe'
          CommandLine|endswith: '"'
      filter_chain_5:
          ParentImage|endswith: 'powershell.exe'
          Image|endswith: 'quser.exe'
          CommandLine|endswith: '"C:\Windows\system32\quser.exe"'
      filters:
          - CommandLine|endswith:
              - 'stop wuauserv'
          - ParentImage|contains|all:
              - '\Program'
              - 'Files'
          - ParentImage|endswith:
              - '\node.exe'
              - 'wazuh-agent.exe'
              - 'cleanmgr.exe'
              - 'thor64.exe'
              - 'amazon-ssm-agent.exe'
              - 'PrinterLogicIdpAuthentication.exe'
              - 'AwWindowsIpc.exe'
              - 'EikonBoxNet.exe'
              - 'TaxBack.exe'
              - 'MonitoringHost.exe'
              - 'ssm-agent-worker.exe'
              - '32\svchost.exe' #task sheduler
          #- CommandLine:
          #    - '"net.exe" accounts' #C:\ProgramData\Microsoft\Windows Defender Advanced Threat Protection\DataCollection\
          #- User|contains:
          #    - '$'
          #    - 'SYSTEM'
          #    - 'SERVICE'
          #    - 'AUTHORITY'
          - Image|endswith:
              - 'tasklist.exe'
              - '.net.exe' #Battle.net.exe
      condition: selection_scope_process_creation and (selection or selection_ps or selection_rare_images) and not (filters or filter_chain_1 or filter_chain_2 or filter_chain_3 or filter_chain_4 or filter_chain_5)
  falsepositives:
      - Administrative activity.
      - It is highly recommended to baseline your activity and tune out common business use cases.
      - The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  level: low
