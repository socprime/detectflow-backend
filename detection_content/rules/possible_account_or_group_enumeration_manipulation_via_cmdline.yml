name: Possible Account or Group Enumeration / Manipulation (via cmdline)
body: |-
  title: Possible Account or Group Enumeration / Manipulation (via cmdline)
  id: 8a701e5f-a0a6-4f58-9a35-1f29a08e4f79
  status: stable
  description: Adversaries may attempt to get a listing/permissions and other info of local system or domain accounts. The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives. It is highly recommended to baseline your activity and tune out common business use cases.
  author: SOC Prime Team
