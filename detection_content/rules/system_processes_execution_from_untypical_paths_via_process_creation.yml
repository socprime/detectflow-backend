  tags:
      - attack.defense_evasion
      - attack.t1055.012
      - attack.t1036
  logsource:
      category: process_creation
      product: windows
  detection:
    selection:
      ParentImage|endswith: '.exe' #must exists.
      Image|endswith:
        - 'SystemSettings.exe'
        - 'calc.exe' # https://www.enki.co.kr/en/media-center/blog/kimsuky-s-advanced-attack-techniques-jsonping-webex-spoofing-and-a-new-httpspy-variant
        - '\smss.exe' # https://www.virustotal.com/gui/file/25802493e7ef64523d6ab13ad6e5555b2b08fd4576ae2edd905ad939d256aa3a/behavior; https://asec.ahnlab.com/en/94552/
        - '\svchost.exe' # https://www.cyberproof.com/blog/a-deep-dive-into-pxa-stealer/; https://www.darktrace.com/blog/inside-zionsiphon-darktraces-analysis-of-ot-malware-targeting-israeli-water-systems; https://www.welivesecurity.com/en/eset-research/frostyneighbor-fresh-mischief-digital-shenanigans/; https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/; https://www.trendmicro.com/en_us/research/26/g/actor-behind-patriot-bait-used-ai-to-deploy-c2-botnet.html; https://www.proofpoint.com/us/blog/threat-insight/carry-compromise-ta4922-packs-packclient; https://asec.ahnlab.com/en/95230/; https://www.huntress.com/blog/fake-gta6-download-malware-analysis; https://checkmarx.com/zero-post/malfex-npm-malware-campaign-three-payloads-and-an-adversary-that-signs-their-work/
        - 'gpupdate.exe'
        - 'taskhostw.exe'
        - 'rundll32.exe'
        - '\sc.exe'
        - 'consent.exe'
        - 'VSSVC.exe' #%PUBLIC%\Libraries\VSSVC.exe
        - 'sethc.exe'
        - '\lsm.exe'
        #- '\dwm.exe'
        - 'spoolsv.exe'
        - '\csrss.exe' # https://www.vmray.com/execution-level-analysis-of-a-russian-speaking-multi-operator-intrusion-campaign-operation-standoff/
        - 'wininit.exe'
        - 'fontdrvhost.exe'
        #- '\conhost.exe'
        - 'ctfmon.exe'
        - 'RuntimeBroker.exe' # https://www.mcafee.com/blogs/other-blogs/mcafee-labs/weedhack-minecraft-malware-as-a-service-campaign-research/; https://www.lac.co.jp/lacwatch/report/20260604_004759.html; https://www.jumpsec.com/guides/an-emerging-silver-fox-like-cluster-papermill/; https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/; https://dreamgroup.com/blog/darkblinders-inside-an-active-espionage-campaign
        - 'dllhost.exe'
        - 'route.exe'
        - 'winlogon.exe'
        - 'systeminfo.exe'
        - 'ntoskrnl.exe'
        - 'timeout.exe'
        - 'explorer.exe'
        - 'mblctr.exe'
      CommandLine|contains: '.exe' #must exists.
    selection_dotnet:
      ParentImage|endswith:
        - '.exe'
        - '.tmp'
        - '.src'
      Image|endswith:
        - 'RegAsm.exe'
        - 'RegSvcs.exe'
    #filter_dwm:
    #  Image|endswith: 'dwm.exe'
    #  ParentImage|endswith: 'svc.exe' #\\ProgramData\\{4CEC2908-5CE4-48F0-A717-8FC833D8017A}\\0.1.263\\{FECA2AA4-B5B5-447C-A8B7-1D21B3900D34}\\dwm.exe
    filter_dotnet:
      - Image|contains|all:
        - 'Windows' #C:\Windows\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe
        - 'Microsoft.NET'
        - 'Framework'
      - Image|contains:
        - '\Program Files'
        - '\Lenovo\Vantage\Addins\LenovoBatteryGaugeAddin'
    filters:
      Image|contains:
        - '\Windows\System32'
        - 'Windows\SysWOW64'
        - ':\Program Files'
        - '.NET\Framework' #SMSvcHost.exe
        - '\Windows\explorer.exe'
    condition: (selection and not filters) or (selection_dotnet and not filter_dotnet)
  falsepositives:
    - Unknown
  level: medium
level: medium
