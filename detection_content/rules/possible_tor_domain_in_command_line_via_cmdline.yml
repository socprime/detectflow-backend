name: Possible TOR Domain in Command Line (via cmdline)
body: |-
  title: Possible TOR Domain in Command Line (via cmdline)
  id: 7534171a-de69-43e4-b85b-e2f77b3ce0a7
  description: Tor address appeared in powershell arguments may be an indicator of c2 communication or data exfiltration attempt.
  status: stable
  references:
    - https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns
    - https://cert.gov.ua/article/6281701
    - https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/
  author: SOC Prime Team
  tags:
    - attack.execution
    - attack.t1059.003
    - attack.command_and_control
    - attack.t1071.001
  logsource:
    product: windows
    category: process_creation
  detection:
    selection:
      Image|endswith:
          - '.exe'
          - '.com'
          - '.scr'
          - '.tmp'
      CommandLine|contains: '.onion' #https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns; https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/
    condition: selection
  falsepositives:
    - unknown
  level: high
level: high
