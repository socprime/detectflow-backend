              - 'supabase.co' # https://www.trendmicro.com/en_us/research/26/c/dissecting-a-warlock-attack.html
              - 'glitch.me'
              - 'run.app'
              - 'bitbucket.org' # https://cocomelonc.github.io/malware/2025/08/28/malware-tricks-51.html
              - 'temspend.com'
              - 'netlify.com' #https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps
              - 'netlify.app'
              - 'vercel.app' #https://kmsec.uk/blog/dprk-text-steganography/; https://jp.security.ntt/insights_resources/tech_blog/stoatwaffle_malware_en/
      condition: selection_procs and selection_domains
  falsepositives:
    - Storage providers approved for business use.
    - The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  level: medium
