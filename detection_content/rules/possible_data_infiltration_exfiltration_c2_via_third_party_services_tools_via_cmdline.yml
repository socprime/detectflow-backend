    - https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps
    - https://www.jamf.com/blog/threat-actors-expand-abuse-of-visual-studio-code/
    - https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399
    - https://www.elastic.co/security-labs/solarwinds-whd-exploitation
    - https://www.welivesecurity.com/en/eset-research/sednit-reloaded-back-trenches/sigma.yml
