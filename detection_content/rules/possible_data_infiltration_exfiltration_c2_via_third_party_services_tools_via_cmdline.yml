              - 'mediafire.com' #https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - 'onedrive.com' #api.onedrive.com; https://www.picussecurity.com/resource/blog/apt41-cyber-attacks-history-operations-and-full-ttp-analysis
