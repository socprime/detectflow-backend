              - 'mega.io' #https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/; https://sosransomware.com/en/ransomware-groups/worldleaks-between-pure-extortion-and-traditional-ransomware-whats-the-difference/
              - 'icloud.com'
              - 'pcloud.com'
              - 'icedrive.net' #https://cert.gov.ua/article/6284080
              - 'app.koofr.net' #https://cert.gov.ua/article/6284080; https://www.picussecurity.com/resource/blog/apt28-cyber-threat-profile-and-detailed-ttps
              - 'WeTransfer.com'
              - 'Onehub.com'
              - 'getfilecloud.com'
              - 'ki.tc'
              - 'uguu.se'
              - 'flyle.app'
              - 'transfer.sh'
              - 'expirebox.com'
              - 'disk.yandex.com'
              - 'filestage.io'
              - 'zippyshare.com'
              - 'drive.google.com' #https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/
              - 'docs.google.com' #https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps; https://www.recordedfuture.com/research/purplebravos-targeting-it-software-supply-chain; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and
              - 'firebase.google.com' #https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and
              - '.box.com'
              - 'hubic.com'
              - 'wikisend.com'
              - 'dropsend.com'
              - 'anonymousfiles.io'
              - 'anonfiles.com'
              - 'filedropper.com'
