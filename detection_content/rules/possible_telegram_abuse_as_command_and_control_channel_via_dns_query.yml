  logsource:
    product: windows
    category: dns_query
  detection:
    selection:
      Image|endswith: '.exe'
      QueryName:
        - 'telegram.me' # https://www.pointwild.com/threat-intelligence/inside-vidar-2026-from-infection-to-memory-execution-via-jpeg-and-txt-payloads/; https://www.levelblue.com/blogs/spiderlabs-blog/unmasking-a-multi-stage-loader-autoit-abuse-leading-to-vidar-stealer-command-and-control-communication; https://meltedinhex.com/posts/clickfix-errtraffic-blockchain-c2/; https://www.picussecurity.com/resource/blog/vidar-malware-how-the-multithreaded-windows-stealer-works
        - 't.me' #https://cyble.com/blog/professional-networks-under-attack-by-infostealer/; https://www.netskope.com/blog/openclaw-hologram-fake-installer-ships-rust-infostealer; https://www.vmray.com/execution-level-analysis-of-a-russian-speaking-multi-operator-intrusion-campaign-operation-standoff/; https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
        - 'api.telegram.org' # api.telegram.org sendDocument https://www.welivesecurity.com/en/eset-research/gorbag-orcs-border-harvesting-intelligence-ukraine/; api.telegram.org https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver; Possible telegram abuse as C2 channel.; https://cert.gov.ua/article/6285731;https://www.sentinelone.com/blog/cybervolk-returns-flawed-volklocker-brings-new-features-with-growing-pains/; https://www.huntress.com/blog/w2-malvertising-to-kernel-mode-edr-kill; https://labs.k7computing.com/index.php/resoker-a-telegram-based-remote-access-trojan/; https://research.jfrog.com/post/solana-fakefix/; https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1; https://www.jumpsec.com/guides/inside-a-dprk-bluenoroff-clickfix-kit/; https://www.rapid7.com/blog/post/tr-operation-asterix-crypto-fraud-vishing-phishing/
        - 'telegra.ph' #Threat actors use Telegraph to store C&C addresses; https://www.malwarebytes.com/blog/threat-intel/2026/08/tracking-pavinloader-across-clickfix-and-fake-download-campaigns
    filters:
      - Image|endswith:
        - 'telegram.exe' # Telegram Desktop
        - 'chrome.exe'
        - 'msedge.exe'
        - 'firefox.exe'
        - 'opera.exe'
        - 'brave.exe'
      - Image|contains|all:
        - '\Program'
        - 'Files'
    condition: selection and not filters
  falsepositives:
    - Legitimate domain communication using rare browsers/third party software.
  level: medium
