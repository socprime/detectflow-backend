  author: SOC Prime Team
  logsource:
      product: windows
      category: process_creation
  detection:
      selection:
          Image|endswith: '.exe'
          CommandLine|contains:
              - 'GlobalSession.ClearLog' #{[System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($l)}
              - 'NTLMType2Response' #https://www.attackiq.com/2025/05/21/response-to-cisa-advisory-aa25-141a
              - 'RemoteEndPoint.Address.IPAddressToString' #https://www.attackiq.com/2025/05/21/response-to-cisa-advisory-aa25-141a
              - '.HttpListener' #https://www.attackiq.com/2025/05/21/response-to-cisa-advisory-aa25-141a
              - 'AllowReversiblePasswordEncryption'
              - 'GetHostAddresses'
              - 'TrustAllCertsPolicy'
              - 'ASCII.GetString' #+; https://isc.sans.edu/diary/rss/32682
              - 'IO.Compression.CompressionMode' #+
              - 'System.IO.Compression.FileSystem' #{ Add-Type Assembly 'System.IO.Compression.FileSystem'; [10.Compression.ZipFile]::CreateFromDirectory(\$path1', 'Spath2');} ;https://www.picussecurity.com/resource/blog/apt28-cyber-threat-profile-and-detailed-ttps
              - 'NoCompression' # [System.IO.Compression.CompressionLevel]::NoCompression, $false); #https://app.any.run/tasks/28a029a0-295a-4eca-ae91-8e645cdb3f5d/
              - 'ASCII.GetBytes' #+
              - 'Utf8.GetBytes' #https://cert.gov.ua/article/6281681; https://www.acronis.com/en/tru/posts/fake-adult-websites-pop-realistic-windows-update-screen-to-deliver-stealers-via-clickfix/; https://www.catonetworks.com/blog/cato-ctrl-vishing-and-microsoft-teams-used-deliver-phantombackdoor/; https://www.fortinet.com/blog/threat-research/dprk-related-campaigns-with-lnk-and-github-c2
              - 'Utf8.GetString' #[System.Text.Encoding]::UTF8.GetString((iwr $url -UseBasicParsing).Content) https://www.air.security/blog-posts/solanacry; https://redcanary.com/blog/threat-intelligence/mocha-manakin-nodejs-backdoor/; https://asec.ahnlab.com/en/92160/; https://www.pointwild.com/threat-intelligence/when-malware-talks-back/; https://isc.sans.edu/diary/32766; https://www.picussecurity.com/resource/blog/t1059-001-powershell; https://www.trellix.com/blogs/research/purerat-fileless-utilizing-steganography-process-hollowing/; https://asec.ahnlab.com/en/94685/
              - 'Unicode.GetBytes'
              - 'AsByteStream' #+
              #- 'Add-Type'
              - 'DllImport' #exc InstallELAMCertificateInfo
              - 'DefineDynamicAssembly'
              - 'DefineDynamicModule'
              - 'DefineType'
              - 'DefineConstructor'
              - 'CreateType'
              - 'DefineLiteral'
              #- 'DefineEnum'
              - 'DefineField'
              - 'ILGenerator'
              #- 'Emit'
              - 'UnverifiableCodeAttribute'
              - 'DefinePInvokeMethod'
              - 'GetTypes'
              - 'GetAssemblies'
              #- 'Methods'
              - 'GetConstructor'
              - 'GetDefaultMembers'
              - 'GetEvent'
              - 'GetField'
              - 'GetInterface'
              - 'GetMember'
              #- 'GetMethod'
              - 'GetNestedType'
              #- 'GetProperties'
              #- 'GetProperty'
              - 'InvokeMember'
              - 'MakeArrayType'
              - 'MakeByRefType'
              - 'MakeGenericType'
              - 'MakePointerType'
              - 'DeclaringMethod'
              - 'DeclaringType'
              - 'ReflectedType'
              - 'TypeHandle'
              - 'TypeInitializer'
              - 'UnderlyingSystemType'
              #- 'InteropServices'
              #- 'Marshal'
              - 'AllocHGlobal'
              - 'PtrToStructure'
              - 'StructureToPtr'
              - 'FreeHGlobal'
              #- 'IntPtr'
              - 'MemoryStream' #https://cert.gov.ua/article/6281681; https://securityaffairs.com/wp-content/uploads/2025/05/Sarcoma-Ransomware.pdf
              - 'DeflateStream'
              - 'FromBase64String' #https://cert.gov.ua/article/6284949; https://www.acronis.com/en/tru/posts/fake-adult-websites-pop-realistic-windows-update-screen-to-deliver-stealers-via-clickfix/; https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/; https://asec.ahnlab.com/en/92160/; https://securityaffairs.com/wp-content/uploads/2025/05/Sarcoma-Ransomware.pdf; https://www.pointwild.com/threat-intelligence/when-malware-talks-back/; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.elastic.co/security-labs/phantom-in-the-vault; https://www.pointwild.com/threat-intelligence/inside-vidar-2026-from-infection-to-memory-execution-via-jpeg-and-txt-payloads/; https://arcticwolf.com/resources/blog/bluenoroff-uses-clickfix-fileless-powershell-and-ai-generated-zoom-meetings-to-target-web3-sector/; https://blog.gdatasoftware.com/2026/05/38426-donutloader-remcos-rat; https://cofense.com/blog/from-fake-amazon-security-alert-to-harborwatch-agent-clickfix-delivery-of-a-custom-monitoring-rat; https://www.netskope.com/jp/blog/malware-on-the-blockchain-an-ongoing-campaigns-new-webrtc-twist; https://www.securonix.com/blog/task-stomp-powershell-backdoor-document-theft-remote-access; https://malbearlabs.com/posts/novel-malware-built-to-survive-the-analyst
              - 'WriteAllBytes' #https://cert.gov.ua/article/6284949; https://research.checkpoint.com/2026/silver-dragon-targets-organizations-in-southeast-asia-and-europe/; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure
              - 'EncodedCommand' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://www.microsoft.com/en-us/security/blog/2026/03/03/signed-malware-impersonating-workplace-apps-deploys-rmm-backdoors
              #- 'Bypass'
              - 'ToBase64String'
              - 'ExpandString'
              - 'GetPowerShell'
              - 'OpenProcess'
              - 'VirtualAlloc'
              - 'VirtualFree'
              - 'WriteProcessMemory'
              - 'CreateUserThread'
              - 'CloseHandle'
              - 'GetDelegateForFunctionPointer'
              - 'kernel32'
              - 'CreateThread'
              #- 'memcpy'
              - 'LoadLibrary'
              - 'GetModuleHandle'
              - 'GetProcAddress' #https://www.picussecurity.com/resource/blog/apt28-cyber-threat-profile-and-detailed-ttps
              - 'VirtualProtect'
              - 'FreeLibrary'
              - 'ReadProcessMemory'
              - 'CreateRemoteThread'
              - 'AdjustTokenPrivileges'
              - 'WriteByte'
              - 'WriteInt32'
              - 'OpenThreadToken'
              - 'PtrToString'
              - 'FreeHGlobal'
              - 'ZeroFreeGlobalAllocUnicode'
              - 'OpenProcessToken'
              - 'GetTokenInformation'
              - 'SetThreadToken'
              - 'ImpersonateLoggedOnUser' #https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/; https://www.picussecurity.com/resource/blog/apt15-cyber-espionage-campaigns-and-ttps-analysis
              - 'RevertToSelf'
              - 'GetLogonSessionData'
              - 'CreateProcessWithToken' #https://research.checkpoint.com/2025/cracking-valleyrat-from-builder-secrets-to-kernel-rootkits/
              - 'CreateProcessWithLogon'
              - 'DuplicateTokenEx'
              - 'OpenWindowStation'
              - 'OpenDesktop'
              - 'MiniDumpWriteDump' #https://research.checkpoint.com/2025/ink-dragons-relay-network-and-offensive-operation/
              - 'AddSecurityPackage' #https://research.checkpoint.com/2025/ink-dragons-relay-network-and-offensive-operation/
              - 'EnumerateSecurityPackages'
              - 'GetProcessHandle'
              #- 'DangerousGetHandle'
              - 'CryptoServiceProvider'
              #- 'Cryptography'
              - 'Cryptography.Aes' #https://cert.gov.ua/article/6282517
              - 'RijndaelManaged'
              - 'SHA1Managed'
              - 'CryptoStream'
              - 'CreateEncryptor'
              - 'CreateDecryptor'
              - 'TransformFinalBlock'
              - 'DeviceIoControl'
              - 'SetInformationProcess'
              - 'PasswordDeriveBytes'
              - 'GetAsyncKeyState'
              - 'GetKeyboardState'
              - 'GetForegroundWindow'
              - 'BindingFlags'
              - 'NonPublic'
              - 'ScriptBlockLogging'
              - 'LogPipelineExecutionDetails'
              - 'ProtectedEventLogging'
  #    filters_chain1:
  #        ParentImage|endswith: 'node.exe'
  #        CommandLine|contains:
  #        - 'UwB0AGEAcgB0ACAAIgBoAHQAdABwADoALwAvAGwAbwBjAGEAbABoAG8AcwB0ADoAMwAwADAAMAAiAA==' #Start "http://localhost:3000"
  #        - 'UwB0AGEAcgB0ACAAIgBoAHQAdABwADoALwAvAGwAbwBjAGEAbABoAG8AcwB0ADoAOAAxACIA' #Start "http://localhost:81"
      filters:
          - CommandLine|contains:
              - '\Program Files'
              #- 'IABbAEUAbgB2AGkAcgBvAG4AbQBlAG4AdABdADoAOgBPAFMAVgBlAHIAcwBpAG8AbgAuAFYAZQByAHMAaQBvAG4AIAA' # .[.E.n.v.i.r
              - '--format='
              - 'showSignature'
              - 'InstallELAMCertificateInfo'
              - 'ADSyncSourceAnchor'
              - 'AttackSurfaceReductionRules'
              - 'ControlledFolderAccessProtectedFolders'
              - 'ExternalHelp'
              - 'MaxQueueSizePercentage'
              - 'InstallWdBoot'
              - 'AuthenticodeSignature'
              - 'GetEvents.VBS'
              - 'ciscat.exe'
              - 'SetImplementationFlags(128)' #activation stuff
          - Image|contains|all:
              - '\Program'
              - 'Files'
          - CommandLine|contains|all:
              - '\Program'
              - 'Files'
          - CommandLine|endswith:
              - 'suffix:_evt_' #Microsoft-Windows-ServicesForNFS-ServicesForNFS-Server
              - 'noextended' # GetEvents.VBS Microsoft-Windows-WinRM/
          - Image|endswith:
              - 'DropboxThumbnailGenerator.exe'
              - 'ciscat.exe'
              - '\MpCmdRun.exe' #"C:\ProgramData\Microsoft\Windows Defender\Platform\4.18.24090.11-0\x86\mpcmdrun.exe" -GetLoadLibraryWAddress -OutputFileMappingHandle 760
              - '\ngen.exe'
          - ParentImage|endswith:
              - 'node.exe'
              - 'QualysAgent.exe'
              - 'system32\svchost.exe' #GPO Tasks with powershell job.
              - '\bin\runnerw64.exe' #phpstorm
              - '\cmd\git.exe' #git
              - 'SenseIR.exe' #Windows Defender
              - 'MsMpEng.exe' #Defender
              - 'ptoneclk.exe' #Webex
              - 'ptupdate.exe' #Webex
              - 'CcmExec.exe' #CCM
              - 'Rave.exe'
              - 'ehachettefle.exe'
              - 'Canva.exe'
              - 'Deezer.exe'
              - '_1st.exe' #PICUS BAS
              - 'GoTo.exe'
          - CommandLine|contains|all:
              - 'Defender' #Defender Advanced Threat Protection\DataCollection
              - 'Advanced'
              - 'Threat'
              - 'Protection'
              - 'DataCollection'
          - CommandLine|contains|all:
              - 'noroot' #/noroot /LegacyServiceBehavior
              - 'LegacyServiceBehavior'
              - 'ngen'
              - 'NativeImages'
          - CommandLine|contains|all:
              - '\Temp\MAS_' #activation stuff
              - '-el -qedit'
              - 'SetImplementationFlags'
          - CommandLine|contains|all:
              - '$Sku = 0' #activation stuff
              - 'Kernel-BrandingInfo'
              - 'DefineDynamicAssembly'
              - 'SLGetWindowsInformationDWORD'
          - CommandLine|contains|all:
              - '%WINDOWS_LONG%' #activation stuff
              - 'winbrand.dll'
      condition: selection and not filters # or filters_chain1)
  falsepositives:
      - Administrative scripts activity.
  level: medium
