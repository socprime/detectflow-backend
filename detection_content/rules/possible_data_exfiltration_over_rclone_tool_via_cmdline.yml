name: Possible Data Exfiltration over Rclone Tool (via cmdline)
body: |-
  title: Possible Data Exfiltration over Rclone Tool (via cmdline)
  id: e0ee9a7b-fed3-4467-a012-0b04338e1334
  status: stable
  description: Need to exclude approved services! Adversaries may exfiltrate data by transferring the data, including backups of cloud environments, to another cloud account they control. The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  author: SOC Prime Team
  references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
