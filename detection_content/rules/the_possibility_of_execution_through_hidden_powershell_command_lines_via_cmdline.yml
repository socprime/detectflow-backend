          - CommandLine|contains|all:
              - 'iex' #https://asec.ahnlab.com/en/94552/
              - 'hidden'
          - CommandLine|contains: ' -w H' #https://0x3obad.github.io/posts/plugx-writeup/; "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -w H
