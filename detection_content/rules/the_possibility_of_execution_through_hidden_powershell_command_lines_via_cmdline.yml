              - 'bypass' # -ep; -ExecutionPolicy; https://www.acronis.com/en/tru/posts/; https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/fake-adult-websites-pop-realistic-windows-update-screen-to-deliver-stealers-via-clickfix/; https://blog.sekoia.io/meet-iclickfix-a-widespread-wordpress-targeting-framework-using-the-clickfix-tactic/; https://isc.sans.edu/diary/rss/32754; https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/; https://www.levelblue.com/blogs/spiderlabs-blog/cncmachinerms-the-undocumented-rat-at-the-end-of-a-babadeda-chain; https://www.genians.co.kr/en/blog/threat_intelligence/kimsuky_ai_llm
