  detection:
      selection_pe:
          ParentImage|endswith:
              - '.exe'
              - '.com'
              - '.scr'
              - '.tmp'
          Image|endswith:
              - '.exe'
              - '.com'
              - '.scr'
              - '.tmp'
      selection:
          - CommandLine|contains|all:
              - 'bypass' # powershell -ExecutionPolicy Bypass -NoProfile -Command; powershell.exe -WindowStyle Hidden -executionpolicy bypass -noprofile -c Invoke-Expression (Get-Content "%TMP%\temporarydoc.txt" -Raw); https://www.bitdefender.com/en-us/blog/labs/fake-xeno-roblox-discord-executor; https://asec.ahnlab.com/en/95230/
