name: From a Deceptive Purchase Order to Remcos RAT
created: '2026-04-21T07:28:47Z'
updated: '2026-10-08T12:35:12Z'
summary: A purchase‑order themed phishing email delivers a double‑extension archive that extracts a VBS loader. The loader runs a hidden PowerShell process which downloads a fake PNG file containing an encoded payload. The payload is deobfuscated, reconstructed as a .NET PE, and loaded in memory, ultimately installing the Remcos remote access trojan. The campaign demonstrates a fully file‑less execution chain using common email attack techniques.
severity: Medium
investigation: The analysis traced the full execution chain from the initial phishing message to the final Remcos RAT payload. Artifacts such as the VBS script name, PowerShell environment variable usage, and the fake PNG download URL were identified. In‑memory loading of the reconstructed .NET assembly and Remcos‑specific registry and mutex artifacts confirmed the final payload. Network indicators including the C2 domain were also captured.
response: Isolate affected endpoints and terminate suspicious PowerShell or wscript.exe processes. Collect memory dumps and registry artifacts for forensic analysis. Remove the Remcos binary and related registry entries, then reset compromised credentials. Conduct a threat hunt for similar indicators across the network.
mitigation: Implement strict attachment scanning and block double‑extension archives. Enforce PowerShell execution policies and restrict wscript.exe usage. Monitor for unusual registry keys under HKCU\SOFTWARE and for TLS JA3 fingerprints associated with Remcos. Regularly update email security gateways to detect phishing lures targeting procurement processes.
