id: AVGHkJ0BFsA9Tj2-c0-W
name: 'When PUPs Grow Fangs: Dragon Boss Solutions Left an Open Door on 25,000+ Endpoints'
created: '2026-04-15T09:40:19Z'
updated: '2026-10-08T12:25:18Z'
summary: A potentially unwanted program (PUP) signed by Dragon Boss Solutions uses a legitimate update mechanism to silently download and execute MSI and PowerShell payloads that disable antivirus products and establish persistence via WMI event subscriptions and scheduled tasks. The updater contacts unregistered domains that anyone could register, turning the PUP into a supply‑chain vector for arbitrary code. Over 25,000 endpoints were observed contacting these domains, many in high‑value sectors.
severity: Critical
investigation: Huntress identified WMI persistence artifacts and a burst of scheduled task creation, traced them to a signed executable RaceCarTwo.exe that launches an MSI installer. The MSI extracts a PowerShell script (ClockRemoval.ps1) that kills AV processes, blocks AV update domains, creates Defender exclusions, and repeatedly re‑installs itself. Unregistered domains such as chromsterabrowser.com were used as the primary update source, allowing any registrant to push payloads.
response: Detect the creation of scheduled tasks named ClockSetupWmiAtBoot, DisableClockServicesFirst, DisableClockAtStartup, RemoveClockAtLogon, and RemoveClockPeriodic. Alert on WMI event subscriptions containing "MbRemoval" or "MbSetup". Monitor processes signed by Dragon Boss Solutions and the presence of the ClockRemoval.ps1 script in WMILoad directories. Review hosts files for blocks against AV vendor domains and check for unexpected Windows Defender exclusions.
mitigation: The research team registered the unregistered domains and sinkholed them, cutting off the update channel. They also documented the WMI event subscriptions, scheduled tasks, and registry modifications to enable detection and removal. Blocking the identified domains and monitoring for the specific scheduled task names and WMI consumers can prevent further infection.
