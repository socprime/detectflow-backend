name: 'Rapid Response: PHP2Shell, Leaked Critical PHP Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)'
created: '2026-10-21T12:00:00Z'
updated: '2026-10-25T18:13:51Z'
summary: Two critical RCE vulnerabilities in PHP, identified as CVE-2026-109618 and CVE-2026-109619, were leaked online prior to their coordinated disclosure. These flaws allow unauthenticated attackers to execute arbitrary code on vulnerable web servers. The vulnerabilities are highly impactful due to PHP's massive footprint in web infrastructure.
severity: Critical
investigation: Researchers from watchTowr and Huntress investigated the leak, confirming the vulnerabilities are real. Amazon and other entities observed active exploitation attempts using various payloads shortly after the leak and following a premature patch release by Chainguard. Analysts noted that attackers are using anonymized infrastructure and mutating payloads to bypass security protections.
response: Monitor web server logs and endpoint telemetry for suspicious child processes spawned by PHP worker processes like php-fpm or apache2. Watch for the execution of shells, interpreters, or networking tools by these processes. If exploitation is suspected, isolate the affected server immediately and preserve logs for forensic analysis.
mitigation: Organizations should immediately inventory all PHP installations, including those bundled in third-party vendor software. Apply the security patches released by the PHP Foundation as soon as they become available. For end-of-life versions that will not receive patches, isolate these systems from the internet or place them behind a VPN or WAF.
