name: New JanaWare ransomware targets Turkey via Adwind RAT
created: '2026-04-15T09:04:07Z'
updated: '2026-10-08T12:29:26Z'
summary: A threat cluster uses a customized Java‑based Adwind RAT to deliver a ransomware module named JanaWare. The campaign is focused on Turkish users, enforcing locale and IP checks before executing. Samples have been observed since 2020 with recent C2 activity in 2025.
severity: High
investigation: The Acronis TRU team analyzed malicious JAR files delivered via phishing emails that launch through Outlook and Chrome. Execution proceeds to javaw.exe which loads the Adwind RAT variant and later the JanaWare ransomware component. The malware uses polymorphic JARs, Tor for C2, and drops a Turkish ransom note.
response: Isolate infected hosts, terminate javaw.exe and related processes, collect volatile data, and restore files from known good backups. Engage incident response to capture C2 traffic and consider notifying law enforcement for extortion cases.
mitigation: Block the malicious domain elementsplugin.duckdns.org and associated ports, restrict execution of unsigned Java JAR files, monitor for chrome.exe command lines downloading from Google Drive, and enforce email phishing defenses. Use endpoint detection to detect Adwind RAT process patterns and encrypting activity.
industries:
- All
geographies:
