name: Hospitals, Local Government Bodies and FPV Operators - Focus of Cyber Threat Cluster UAC-0247
created: '2026-04-15T14:05:40Z'
updated: '2026-10-09T09:25:15Z'
summary: During March‑April 2026 CERT‑UA observed an increase in attacks targeting Ukrainian hospitals, municipal authorities and FPV operator groups. The campaigns use phishing emails with malicious HTA/HTML links that deliver custom loaders, reverse shells (RAVENSHELL) and the C# based remote access tool AGINGFLY. Additional payloads include PowerShell backdoors (SILENTLOOP), credential stealers (CHROMELEVATOR, ZAPIXDESK) and public scanning tools (RUSTSCAN). The threat actors also employ DLL side‑loading, scheduled tasks and a range of custom command‑and‑control (C2) infrastructure.
severity: Critical
investigation: CERT‑UA analysed dozens of incidents, extracting IOCs such as malicious executables, scripts, scheduled tasks, IP addresses and domains. The analysis identified a two‑stage loader, a reverse TCP shell with XOR encryption and a WebSocket based C2 channel that uses a static AES‑CBC key. The investigators also documented the use of legitimate utilities (mshta.exe, powershell.exe, wscript.exe) to execute the malicious HTA files.
response: Security teams should immediately block the identified malicious URLs and IPs, hunt for the listed file names and scheduled tasks on endpoints, and isolate compromised hosts. Deploy detection rules for the observed command lines and monitor for the AGINGFLY WebSocket traffic. Conduct credential reset for accounts that may have been harvested.
mitigation: The report recommends disabling execution of LNK, HTA and JavaScript files from email, restricting use of mshta.exe, powershell.exe and wscript.exe, and enforcing application allow‑lists. Monitoring for the creation of suspicious scheduled tasks and for network connections to the listed C2 servers is also advised.
