body: |
  title: Gamaredon (Primitive Bear) APT Profile and MITRE ATT&CK Breakdown
  description: Gamaredon is a Russia-aligned advanced persistent threat group active since 2013, attributed to the Russian FSB. The group focuses on cyber espionage and data theft, primarily targeting Ukrainian government and defense sectors. They utilize custom malware families such as GammaLoad and GammaSteel alongside various obfuscation and persistence techniques.
