id: Riwu9NconRzw
name: PHP2Shell, Leaked Critical PHP Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)
body: |-
  title: PHP2Shell, Leaked Critical PHP Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)
  description: Two critical remote code execution vulnerabilities in PHP, identified as CVE-2026-109618 and CVE-2026-109619, were leaked online prior to official disclosure. Both bugs trigger during multipart request parsing, before any application code runs, and allow attackers to execute arbitrary commands on affected web servers. The chain correlates exploitation symptoms (anomalous multipart bodies, memory exhaustion, PHP worker crashes) with follow-on web shell drops, PHP worker child processes and reverse shell / C2 tooling on the same host.
  id: a1b2c3d4-e5f6-7a8b-9c0d-123456789abc
  status: experimental
  author: SOC Prime Team
  references:
    - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
  tags:
    - attack.initial_access
    - attack.t1190 # Exploit Public-Facing Application
    - attack.persistence
    - attack.t1505.003 # Server Software Component: Web Shell
    - attack.execution
    - attack.t1059.004 # Command and Scripting Interpreter: Unix Shell
    - attack.command_and_control
    - attack.t1095 # Non-Application Layer Protocol
  logsource:
    category: detectflow
  detection:
    seq0:
      ruleid|contains:
        #- 9ed89653-2dbf-4802-92f7-6574b2f9bc41 # Possible CVE-2026-109618 / CVE-2026-109619 Exploitation Attempt - Suspicious Multipart Request Body (via webserver)
        - 42cd03f3-6b9f-49ea-9bf4-ce0caed6f772 # Possible CVE-2026-109618 / CVE-2026-109619 Exploitation Attempt - PHP Memory Exhaustion / PHP Worker Crash (via webserver error logs)
        - 0b13c412-f141-490d-a99a-4579ae614795 # Possible CVE-2026-109618 / CVE-2026-109619 Exploitation Attempt - PHP Worker Segfault (via syslog)
    seq2:
      ruleid|contains:
        - 0524fca5-8a89-4d38-9a75-fe7dcba39271 # Possible PHP Worker Spawning Unusual Process (via cmdline)
        - ac652c9a-dd0b-11ec-9d64-0242ac120002 # Suspicious Persistence Activity by Execution Of Shell Commands From Web Service Users And Groups (via auditd)
        - be5f785a-0a7f-438e-be60-0a4fb15adcec # Possible Web Server or WebApp Exploitation [Windows] (via cmdline)
        - d0372d6b-b7c8-411f-8f20-4861d49494c4 # Possible Web Shell Drop - PHP Script or Web Config File Written by PHP Web Worker [Linux] (via file_event)
        - e7e64200-04ba-479a-9a51-c614bd74c4fb # Possible Web Shell Drop - PHP Script or Web Config File Written by PHP Web Worker [Windows] (via file_event)
    seq3:
      ruleid|contains:
        - 8715c8a4-9bcb-47e2-ab10-98e6e8eb140c # Possible php Application Command and Control by Reverse Shell Inline Execution (via cmdline)
        - d5c6360e-6637-44c8-bf60-46018f419a08 # FIFO Special File Creation (via cmdline)
        - e4b95599-8caf-41d4-b0a9-26478d133904 # Possible Data Exfiltration / Reverse Shell via Bash (via cmdline)
        - 66b6f425-42f0-484d-b242-64211239f5d0 # Remote File Upload / Download via Standard Tools (via cmdline)
        - 12c98d5b-1e6f-457f-a82e-b1240373d14b # Possible Base64 Encoded Strings Manipulation (via cmdline)
    timeframe: 30m
    condition: chain by hostname
  falsepositives:
    - CMS plugin installation via web UI followed by administrative shell troubleshooting on the same host (unlikely in this exact sequence)
  level: critical
level: critical
