name: Possible Manual Service or Driver Install for Persistence (via cmdline)
body: |-
  title: Possible Manual Service or Driver Install for Persistence (via cmdline)
  id: 39fd7f61-89d5-4fe2-8c00-534506d06b10
  description: Adversaries may install a new service that can be configured to execute at startup by using utilities to interact with services.
  status: stable
  author: SOC Prime Team
  references:
      - https://blog-en.itochuci.co.jp/entry/2026/09/25/090000
      - https://asec.ahnlab.com/en/95211/
