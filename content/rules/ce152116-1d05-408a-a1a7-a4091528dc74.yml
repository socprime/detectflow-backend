name: An Archive Was Extracted To Suspicious Directory Using Powershell (via powershell)
body: |-
  title: An Archive Was Extracted To Suspicious Directory Using Powershell (via powershell)
  id: ce152116-1d05-408a-a1a7-a4091528dc74
  status: stable
  author: SOC Prime Team
  description: Adversaries may try to use powershell in order to extract an archive containing malicious payloads.
  references:
    - https://www.rstcloud.com/ftp-banner-dead-drops-a-hunters-field-guide-to-e4del-and-pinhole/
    - https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/
