name: Possible Data Infiltration / Exfiltration / C2 via Third Party Services / Tools (via dns_query)
body: |-
  title: Possible Data Infiltration / Exfiltration / C2 via Third Party Services / Tools (via dns_query)
  id: 2e025289-ae4b-4eab-a00a-58bc4a5623d7
  status: stable
  description: Need to exclude approved services! Attackers may utilize third-party services and tools in an effort to aid data infiltration / exfiltration and command and control efforts. The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  author: SOC Prime Team
  references:
    - https://asec.ahnlab.com/en/95599/
    - https://d01a.github.io/xloader/
    - https://cert.gov.ua/article/6318634
    - https://www.welivesecurity.com/en/eset-research/gamaredon-2025-leveraging-tunnels-workers-dead-drops-new-alliances/
    - https://blog.exatrack.com/Tracking_APT28_PixyNetLoader/
    - https://blog.sekoia.io/fsbs-matryoshka-1-3-gamaredons-gifts-that-keeps-unpacking-gammaphish-and-gammaworm/
    - https://thehackernews.com/2026/03/north-korean-hackers-publish-26-npm.html
    - https://kmsec.uk/blog/dprk-text-steganography/
    - https://www.microsoft.com/en-us/security/blog/2026/02/24/c2-developer-targeting-campaign/
  tags:
    - attack.exfiltration
    - attack.t1537
    - attack.t1567.002
    - attack.command_and_control
    - attack.t1105
    - attack.t1071.001
  logsource:
      category: dns_query
      product: windows
  detection:
      selection_procs:
          Image|endswith:
              - 'cmd.exe'
              - 'powershell.exe'
              - 'python.exe'
              - 'wscript.exe'
              - 'cscript.exe'
              - 'mshta.exe'
              - 'ruby.exe'
      selection_domains:
          QueryName|contains:
              - 'cdn.imageurlgenerator.com' #https://cert.gov.ua/article/6318634
              - 'easysend.co' #https://cert.gov.ua/article/6318634
              - 'filemail.com' #https://cert.gov.ua/article/6318634
              - 'cleverapps.io'
              - 'pastee.dev'
              - 'nopaste.net'
              - 'lesma.eu'
              - 'write.as'
              - 'supabase.co'
              - 'loca.lt'
              - 'loophole.site'
              - 'loophole.cloud'
              - 'workers.dev'
              - 'glot.io' #https://blog.virustotal.com/2026/02/from-automation-to-infection-how.html
              - 'filen.io' #https://cert.gov.ua/article/6287250; CERT-UA#19542
              - 'filen.dev' #https://cert.gov.ua/article/6287250; CERT-UA#19542
              - 'filen.net' #https://cert.gov.ua/article/6287250; CERT-UA#19542
