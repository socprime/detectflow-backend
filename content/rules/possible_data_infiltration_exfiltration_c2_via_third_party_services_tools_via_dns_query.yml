              - 'disk.yandex.com'
              - 'filestage.io'
              - 'zippyshare.com'
              - 'drive.google.com' #https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/
              - 'docs.google.com' #https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps; https://www.recordedfuture.com/research/purplebravos-targeting-it-software-supply-chain; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and
