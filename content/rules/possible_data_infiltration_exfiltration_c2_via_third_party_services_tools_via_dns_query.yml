              - 'instant.io'
              - 'copy.com'
              - 'mega.co.nz'
              - 'mega.nz'
              - 'mega.io' #https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/; https://www.picussecurity.com/resource/blog/hunters-international-ransomware
              - 'mega.io' #https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/; https://sosransomware.com/en/ransomware-groups/worldleaks-between-pure-extortion-and-traditional-ransomware-whats-the-difference/
