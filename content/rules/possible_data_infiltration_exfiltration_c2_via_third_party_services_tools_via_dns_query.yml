              - 'gofile.io'
              - 'put.io'
              - '4shared.com'
              - 'dropboxusercontent.com' #https://www.trendmicro.com/en_us/research/26/a/analyzing-a-a-multi-stage-asyncrat-campaign-via-mdr.html
              - 'supabase.co' # https://blog.sekoia.io/fsbs-matryoshka-1-3-gamaredons-gifts-that-keeps-unpacking-gammaphish-and-gammaworm/
              - 'glitch.me'
              - 'run.app'
              - 'bitbucket.org'
              - 'temspend.com'
              - 'netlify.com' #https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps
              - 'netlify.app'
              - 'vercel.app' #https://kmsec.uk/blog/dprk-text-steganography/
      condition: selection_procs and selection_domains
  falsepositives:
    - Storage providers approved for business use.
    - The reliance on the surrounding environment may necessitate the implementation of additional filtering measures to prevent false positives.
  level: medium
