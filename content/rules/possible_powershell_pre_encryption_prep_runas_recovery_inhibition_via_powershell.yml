id: LzvrnXJ8JJtd
name: Possible PowerShell Pre-Encryption Prep (RunAs + Recovery Inhibition) (via powershell)
body: |-
  title: Possible PowerShell Pre-Encryption Prep (RunAs + Recovery Inhibition) (via powershell)
  id: 991bc36f-3348-4aeb-868a-380294c7fd36
  status: stable
  author: SOC Prime Team
  description: Detects a PowerShell script pattern observed by Talos self-elevation via RunAs (“Test-Admin”) followed by system recovery inhibition.
  references:
    - https://blog.talosintelligence.com/byovd-loader-deadlock-ransomware/
    - https://www.picussecurity.com/resource/blog/funksec-raas-operations-hacktivism-meets-cybercrime
    - https://www.picussecurity.com/resource/blog/inside-safepay-analyzing-the-new-centralized-ransomware-group
  tags:
    - attack.privilege_escalation
    - attack.t1548.002       # Bypass UAC
    - attack.impact
    - attack.t1490           # Inhibit System Recovery
  logsource:
    product: windows
    service: powershell
  detection:
    elevate:
      ScriptBlockText|contains: '-Verb RunAs' # The article notes the script also disables protections and deletes shadow copies.
    recovery_terms:
      ScriptBlockText|contains:
        - 'vssadmin Delete Shadows'
        - 'wmic shadowcopy delete'
        - 'Disable-RealtimeMonitoring'
        - 'wevtutil sl'
    condition: elevate and recovery_terms
  falsepositives:
    - Admin automation that legitimately elevates and manages recovery; validate signer and source path.
  level: high
level: high
