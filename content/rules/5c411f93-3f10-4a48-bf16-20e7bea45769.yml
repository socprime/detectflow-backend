name: Call Suspicious .NET Classes/Methods from Powershell CommandLine (via process_creation)
body: |-
  title: Call Suspicious .NET Classes/Methods from Powershell CommandLine (via process_creation)
  id: 5c411f93-3f10-4a48-bf16-20e7bea45769
  status: stable
  description: Detects suspicious .net methods/classes which are using in offensive purpose.
  references:
      - https://hunt.io/blog/philippine-government-employment-agency-records-stolen
