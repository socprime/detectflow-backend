  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          Image|endswith:
              - '.exe'
              - '.com'
              - '.scr'
              - '.tmp'
          CommandLine|contains:
              - ' .lnk'
              - '...lnk' #https://asec.ahnlab.com/en/94552/
              - '.doc.lnk'
              - '.docx.lnk' # Proposition_Projet_Personnalisable.docx.lnk https://www.darktrace.com/blog/cikabika-bot-inside-a-discord-rat; https://cert.gov.ua/article/6286942; https://blog.talosintelligence.com/powmix-botnet-targets-czech-workforce/
              - '.xls.lnk'
              - '.xlsx.lnk'
              - '.ppt.lnk'
              - '.pptx.lnk'
              - '.rtf.lnk'
              - '.pdf.lnk' #; https://cert.gov.ua/article/6282517; https://cloud.google.com/blog/topics/threat-intelligence/apt41-innovative-tactics/; https://cert.gov.ua/article/6285731; https://www.zscaler.com/blogs/security-research/middle-east-conflict-fuels-opportunistic-cyber-attacks; https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx; https://www.genians.co.kr/en/blog/threat_intelligence/kakaotalk; https://www.pointwild.com/threat-intelligence/covert-rat-phishing-campaign/; https://www.fortinet.com/blog/threat-research/dprk-related-campaigns-with-lnk-and-github-c2; https://infosecwriteups.com/north-korea-linked-hackers-use-github-as-c2-infrastructure-to-attack-south-korea-1bdcbaf9a9d8; https://www.seqrite.com/blog/operation-dragon-whistle-ung002-targets-chinese-academia-via-weaponized-institutional-lure/; https://www.lac.co.jp/lacwatch/report/20260604_004759.html; https://www.genians.co.kr/en/blog/threat_intelligence/kimsuky_ai_llm;  https://www.seqrite.com/blog/operation-quicsilver-china-nexus-actor-targets-myanmar-diplomats-via-vhd-delivered-go-backdoor/; https://www.enki.co.kr/en/media-center/blog/inside-kimsuky-s-abuse-of-legitimate-remote-control-tools-across-northeast-asia; https://ctrlaltintel.com/bulletins/rustgate-v2/; https://socradar.io/blog/operation-conflict-compass-konni-ukraine-lnk-lure/; https://cofense.com/blog/from-payment-plan-to-ransomware-inside-a-global-group-attack; https://www.genians.co.kr/en/blog/threat_intelligence/operation-gitpower
              - '.txt.lnk' # https://cert.gov.ua/article/6288271; https://blog.synapticsystems.de/uac-0247-malware-targeting-fpv-operators/
              - '.jpg.lnk'
              - '.gif.lnk'
              - '.png.lnk' # https://blog.itochuci.co.jp/entry/2026/06/11/110000
              - '.jpeg.lnk'
              - '.zip.lnk'
              - '.7z.lnk'
              - '.dat.lnk'
              - '.img.lnk'
              - '.hwp.lnk'
      filters:
          CommandLine|contains|all:
              - 'AppData'
              - 'Roaming'
              - 'Microsoft'
              - 'Office'
              - 'Recent'
      condition: selection and not filters
  falsepositives:
      - none
  level: high
