name: Possible CVE-2025-8088 / CVE-2025-6218 (WinRAR Vulnerability) Exploitation Attempt (via file_event)
body: |-
  title: Possible CVE-2025-8088 / CVE-2025-6218 (WinRAR Vulnerability) Exploitation Attempt (via file_event)
  id: c550cc75-398e-4985-a1e9-5088e126e468
  status: stable
  author: SOC Prime Team
  description: Exploiters can craft archives that drop executable files into locations that automatically run programs, like the Windows Startup folder. (threat actor Storm-0978 (Tropical Scorpius / UNC2596) uses this technique to deliver RomCom backdoors.)
