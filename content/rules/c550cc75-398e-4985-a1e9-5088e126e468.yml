  tags:
    - attack.t1203
    - attack.execution
    - attack.t1547.001
    - attack.persistence
  logsource:
    category: file_event
    product: windows
  detection:
    selection:
      Image|endswith: 'WinRAR.exe'
      TargetFilename|endswith: '\Programs\Startup' #\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\Display Settings.lnk
    condition: selection
  falsepositives:
    - Unknown
  level: high
