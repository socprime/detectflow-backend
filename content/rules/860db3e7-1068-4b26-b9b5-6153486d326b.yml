          - ParentImage|endswith:
              - 'vssshadowfix.exe' #c:\programdata\dell\supportassist\agent\downloads\notification\addons\10044\vssshadowfix.exe
          - CommandLine|contains:
              - 'AutoRetry' #...Create Shadow /AutoRetry=15 /For=\\?\Volume{2d64da14-16d3-4387-a1a7-482f6eb5322f}\
      condition: (selection and selection_vars) and not filters
  falsepositives:
      - Administrative activity of foreign staff, backup operations.
  level: high
