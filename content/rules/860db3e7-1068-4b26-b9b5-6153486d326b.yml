      category: process_creation
      product: windows
  detection:
      selection:
          Image|endswith: 'vssadmin.exe'
          CommandLine|contains: 'shadow' #3. vssadmin.exe delete shadows /all /quiet; https://www.fortinet.com/blog/threat-research/evolution-of-chaos-ransomware-faster-smarter-and-more-dangerous; https://www.picussecurity.com/resource/blog/apt28-cyber-threat-profile-and-detailed-ttps
      selection_vars:
          CommandLine|contains:
              #- 'list' #noizy DellSupportAssistRemedationService.exe, etc.
              - 'create' #https://www.picussecurity.com/resource/blog/apt41-cyber-attacks-history-operations-and-full-ttp-analysis; https://detect.fyi/playbook-hunting-chinese-apt-379a6b950492; https://hackers-arise.com/digital-forensics-hunting-chinese-apts-abusing-native-windows-tools/; https://www.huntress.com/blog/vss-abuse-explained
              - 'delete' # vssadmin purge Volume Shadow Copies https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/; https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html; https://asec.ahnlab.com/ko/90360/; https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps; https://www.picussecurity.com/resource/blog/the-lockbit-comeback-how-the-group-evolved-after-a-global-takedown; https://www.sentinelone.com/blog/cybervolk-returns-flawed-volklocker-brings-new-features-with-growing-pains/; https://www.picussecurity.com/resource/blog/funksec-raas-operations-hacktivism-meets-cybercrime; https://www.attackiq.com/2025/09/25/ransom-tales-4/; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server; https://research.checkpoint.com/2026/vect-ransomware-by-design-wiper-by-accident/; https://isc.sans.edu/diary/rss/33024; https://www.extrahop.com/blog/anatomy-of-an-attack-vect-20-ransomwarehttps://www.extrahop.com/blog/anatomy-of-an-attack-vect-20-ransomware; https://www.attackiq.com/2026/07/31/analyzing-nova-ransomware/; https://andreafortuna.org/2026/09/07/panzer-ransomware-italian-victims/; https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/; https://socradar.io/blog/n0n-ransomware-ai-assisted-extortion/
