      - https://research.jfrog.com/post/xinference-compromise/s
      - https://flare.io/learn/resources/blog/teampcp-cloud-native-ransomware
      - https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/
      - https://unit42.paloaltonetworks.com/modern-kubernetes-threats/
      - https://socket.dev/blog/axios-npm-package-compromised
      - https://www.akamai.com/blog/security-research/2026/feb/zerobot-malware-targets-n8n-automation-platform
      - https://thehackernews.com/2026/03/north-korean-hackers-publish-26-npm.html
      - https://kmsec.uk/blog/dprk-text-steganography/
      - https://x.com/ESETresearch/status/1960365364300087724
      - https://www.linkedin.com/posts/anton-cherepanov-b8653276_promptlock-activity-7366142680097017856-bVVY/
      - https://app.any.run/tasks/d0813b09-19f3-422c-8066-39d53c2eeead
      - https://threadreaderapp.com/thread/1960365364300087724.html
