name: Remote File Upload / Download via Standard Tools (via cmdline)
body: |-
  title: Remote File Upload / Download via Standard Tools (via cmdline)
  id: 66b6f425-42f0-484d-b242-64211239f5d0
  status: stable
  description: Fetch a remote file via standard file download tool.
  author: SOC Prime Team
  references:
