      - https://gbhackers.com/skidmap-malware-attacking-linux-distributions/
      - https://blog.viettelcybersecurity.com/cve-2022-21587-oracle-e-business-suite-unauth-rce/
      - https://github.com/hieuminhnv/CVE-2022-21587-POC/blob/main/exploit.py
      - https://www.rapid7.com/blog/post/2023/02/07/etr-cve-2022-21587-rapid7-observed-exploitation-of-oracle-e-business-suite-vulnerability/
      - https://hybrid-analysis.com/sample/f2e963dd8e751127369384ed8c49e9f37357c6db65731325f3e46643d23a8d10?environmentId=300
      - https://www.cadosecurity.com/migo-a-redis-miner-with-novel-system-weakening-techniques/
