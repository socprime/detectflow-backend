id: KMehetmJxnYd
name: Admin Change the Password for other Admin (via audit)
body: |-
  title: Admin Change the Password for other Admin (via audit)
  id: a961fbe5-1acd-49cc-8233-413b46653f52
  description: To monitor when a domain admin user changes his password manually in AD for himself/other domain Admin
  status: stable
  author: SOC Prime Team
  references:
      - https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4724
      - https://socprime.com/detectflow/ # FOR DF DEMO
  tags:
      - attack.credential_access
      - attack.t1098
  logsource:
      product: windows
      service: security
  detection:
      selection:
          EventID: 4724
          SubjectUserName|contains:
              - 'Adm' #for case-sensetive fields
              - 'adm'
          TargetUserName|contains:
              - 'Adm' #for case-sensetive fields
              - 'adm'
      condition: selection
  falsepositives:
      - Administrative activity
  level: medium
level: medium
