id: 13tRai0PPpzY
name: Possible Web Shell Drop - PHP Script or Web Config File Written by PHP Web Worker [Windows] (via file_event)
body: |-
  title: Possible Web Shell Drop - PHP Script or Web Config File Written by PHP Web Worker [Windows] (via file_event)
  id: e7e64200-04ba-479a-9a51-c614bd74c4fb
  status: stable
  description: Detects a PHP web worker (php-cgi.exe, httpd.exe) writing PHP scripts, .htaccess or .user.ini files. After PHP2Shell remote code execution, attackers drop web shells or set auto_prepend_file in .user.ini for persistence.
  author: SOC Prime Team
  references:
      - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
  tags:
      - attack.persistence
      - attack.t1505.003
  logsource:
      product: windows
      category: file_event
  detection:
      selection_image:
          Image|endswith:
              - '\php-cgi.exe'
              - '\httpd.exe'
      selection_target:
          TargetFilename|endswith:
              - '.php5'
              - '.php7'
              - '.php'
              - '.phtml'
              - '.phar'
              - '.pht'
              - '\.user.ini'
              - '\.htaccess'
      filters:
          TargetFilename|contains:
              - '\wp-content\cache'
              - '\wp-content\upgrade'
              - '\bootstrap' # Laravel
              - '\var\cache'
      condition: selection_image and selection_target and not filters
  falsepositives:
      - CMS plugin / theme installation and auto-updates via web UI
      - Template engines compiling PHP cache files outside filtered paths
  level: medium
level: medium
