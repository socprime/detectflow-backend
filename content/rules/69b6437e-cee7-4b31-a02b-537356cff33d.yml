name: Download or Upload via Powershell (via cmdline)
body: |-
  title: Download or Upload via Powershell (via cmdline)
  id: 69b6437e-cee7-4b31-a02b-537356cff33d
  status: stable
  description: By leveraging a combination of indicators, the rule aims to flag instances where possible malicious actors may be attempting to download malicious content (as like next stage of malware) or upload confidential data (through the use of automated processing after being gathered during Collection tactic) via PowerShell. For instance, it targets specific PowerShell methods such as DownloadString, UploadData, etc. which are commonly associated with downloading or uploading activities in malicious scripts or hands-on post-exploitation actions. The reliance on the surrounding environment may necessitate the implementation of additional filtering (for legitimate administrative scripts and processes) measures to prevent false positives.
