              - '.cmd' # https://phorion.io/blog/offical-claude-code-vsx-compromise/
              - '.hta'
              - '.ps1'
              - '.exe' #%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\customchecker.com.exe; https://cert.gov.ua/article/6282517; CVE-2025-8088 / CVE-2025-6218; https://www.bleepingcomputer.com/news/security/winrar-zero-day-flaw-exploited-by-romcom-hackers-in-phishing-attacks/; https://www.sentinelone.com/blog/cybervolk-returns-flawed-volklocker-brings-new-features-with-growing-pains/; https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html; https://www.zscaler.com/blogs/security-research/2cloader-new-malware-loader-delivering-vidar-and-remus
