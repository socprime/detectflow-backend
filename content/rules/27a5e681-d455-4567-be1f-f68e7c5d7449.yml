              - '.py'
              - '.pyw'
      selection_location:
          TargetFilename|contains|all:
              - 'Microsoft'
              - 'Windows'
              - 'Start'
              - 'Menu'
              - 'Programs'
              - 'Startup' #\Microsoft\Windows\Start Menu\Programs\Startup\ #CVE-2025-8088 / CVE-2025-6218; https://www.bleepingcomputer.com/news/security/winrar-zero-day-flaw-exploited-by-romcom-hackers-in-phishing-attacks/; https://cert.gov.ua/article/6285549; https://expel.com/blog/gootloaders-malformed-zip/
      selection_archivers: # archivers live in Program Files but write to Startup only via path traversal (CVE-2025-8088 / CVE-2025-6218)
          Image|endswith:
              - '\WinRAR.exe' # Повідомлення 4726-49.rar CVE-2025-8088 https://www.welivesecurity.com/en/eset-research/gorbag-orcs-border-harvesting-intelligence-ukraine/
              - '\7z.exe'
              - '\7zFM.exe'
              - '\7zG.exe'
      filters:
          Image|contains:
              - '\Program Files'
              - 'cloud-drive-ui.exe'
      filters_block1:
          Image|endswith: 'onenote.exe'
          TargetFilename|endswith: 'OneNote.lnk'
      filters_block2:
          Image|endswith: 'svchost.exe'
          TargetFilename|endswith: 'BGInfo.bat'
      condition: (selection_ext and selection_location) and not ((filters and not selection_archivers) or filters_block1 or filters_block2)
  falsepositives:
      - Software installers.
  level: medium
