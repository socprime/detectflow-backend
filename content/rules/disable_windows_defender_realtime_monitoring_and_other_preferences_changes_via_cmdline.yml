  logsource:
      category: process_creation
      product: windows
  detection:
      #selection_action:
      #    ParentImage|endswith: #must exists!
      #        - '.exe' # example lolbin - SystemSettingsAdminFlows.exe
      #        - '.tmp'
      #        - '.src'
      #    Image|endswith:
      #        - '.exe' # example lolbin - SystemSettingsAdminFlows.exe
      #        - '.tmp'
      #        - '.src'
      #    CommandLine|contains:
      #        - '1'
      #        - 'true'
      #        - 'Add'
      #        - 'Defender' # cmdline of  SystemSettingsAdminFlows.exe
      selection_args:
          ParentImage|contains: '.' #must exists.; https://cloud.google.com/blog/topics/threat-intelligence/ransomware-ttps-shifting-threat-landscape/
          Image|contains: '.' # must exist.
          CommandLine|contains:
              - 'ExclusionProcess' # https://www.netskope.com/blog/openclaw-hologram-fake-installer-ships-rust-infostealer
              - 'ExclusionPath' #powershell Add-MpPreference -ExclusionPath C:\Windows\temp; https://www.huntress.com/blog/nezha-china-nexus-threat-actor-tool; https://www.proofpoint.com/us/blog/threat-insight/when-monster-bytes-tracking-ta585-and-its-arsenal; https://www.attackiq.com/2025/11/14/sandworm/; https://cert.gov.ua/article/6287707; https://www.picussecurity.com/resource/blog/t1059-001-powershell; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.securonix.com/blog/faux-elevate-threat-actors-crypto-miners-and-infostealers/
              - 'ExclusionExtension'
              - 'ExclusionIpAddress' #https://www.acronis.com/en/tru/posts/fake-adult-websites-pop-realistic-windows-update-screen-to-deliver-stealers-via-clickfix/
              - 'DisableAntiSpyware' #https://www.sentinelone.com/blog/cybervolk-returns-flawed-volklocker-brings-new-features-with-growing-pains/; https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableBehaviorMonitoring' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableIOAVProtection' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server; https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
              - 'DisableOAVProtection' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399
              - 'DisableOnAccessProtection' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableRealtimeMonitoring' #https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html; https://www.sentinelone.com/blog/cybervolk-returns-flawed-volklocker-brings-new-features-with-growing-pains/; https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server; https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html; https://www.huntress.com/blog/the-gentlemen-ransomware-defense-evasion-ttps; https://www.vmray.com/execution-level-analysis-of-a-russian-speaking-multi-operator-intrusion-campaign-operation-standoff/; https://cloud.google.com/blog/topics/threat-intelligence/financially-motivated-threat-actor-breeze-comet-targets-brazil/
              - 'DisableScanOnRealtimeEnable' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableEnhancedNotifications' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableBlockAtFirstSeen' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'DisableScriptScanning' #https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
              - 'DisableIntrusionPreventionSystem' #https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
              - 'DisableArchiveScanning'
              - 'SignatureDisableUpdateOnStartupWithoutEngine'
              - 'DisablePrivacyMode'
              - 'PUAProtection'
              - 'SubmitSamplesConsent' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'SpynetReporting' #https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server; https://asec.ahnlab.com/en/95516/
              - 'AttackSurfaceReductionOnlyExclusions'
              - 'ControlledFolderAccessAllowedApplications'
              - 'ControlledFolderAccessProtectedFolders'
              - 'DisableAntiVirus' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'NotificationSuppress' #https://hunt.io/blog/thegentlemen-ransomware-toolkit-russian-proton66-server
              - 'EnableControlledFolderAccess' #https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
              - 'MAPSReporting' #https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
      selection_using_dissm_base:
          Image|endswith: 'dism.exe'
          CommandLine|contains: 'Windows-Defender' #dism.exe /online /Disable-Feature /FeatureName:Windows-Defender /Remove /NoRestart
      selection_using_dissm_vars:
          CommandLine|contains:
              - '/Remove'
              - '/Disable-Feature'
      filters:
          - ParentImage|endswith:
              - 'mfetp.exe' #"C:\Program Files\McAfee\Endpoint Security\Threat Prevention\mfetp.exe" -mms
              - 'gc_worker.exe' # Azure Connected Machine Agent
          - CommandLine|contains|all:
              - 'inputformat'
              - 'none' #powershell -inputformat none -outputformat text -NonInteractive -Command Get-MpPreference | select -ExpandProperty "ExclusionProcess"
              - 'outputformat'
              - 'text'
              - 'MpPreference'
              - 'ExpandProperty'
      filter_chain1: #pycharm operations.
          ParentImage|endswith: 'pycharm64.exe'
          CommandLine|contains|all:
              - 'text'
              - 'inputformat'
              - 'MpPreference'
              - 'ExpandProperty' #powershell -inputformat none -outputformat text -NonInteractive -Command "Get-MpPreference | select -ExpandProperty \"ExclusionProcess\""
      condition: (selection_args or (selection_using_dissm_base and selection_using_dissm_vars)) and not (filters or filter_chain1)
  falsepositives:
      - Administrative activity of foreign staff.
  level: high
level: high
