name: Disable Windows Defender Realtime Monitoring and Other Preferences Changes (via cmdline)
body: |-
  title: Disable Windows Defender Realtime Monitoring and Other Preferences Changes (via cmdline)
  id: 017ffc83-da26-4abc-b419-df6f9801cc2c
  description: Adversaries may disable security tools, such like Windows Defender, to avoid possible detection of their tools and activities.
