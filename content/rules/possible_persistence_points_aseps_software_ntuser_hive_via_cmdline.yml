      - https://asec.ahnlab.com/en/61631/
      - https://blog.talosintelligence.com/timbrestealer-campaign-targets-mexican-users/
      - https://rexorvc0.com/2024/03/25/NanoCore_Update/
      - https://www.seqrite.com/blog/pakistani-apts-escalate-attacks-on-indian-gov-seqrite-labs-unveils-threats-and-connections/
      - https://www.logpoint.com/en/blog/emerging-threats/kapeka-backdoor/
      - https://www.picussecurity.com/resource/blog/mitre-attck-t1547-boot-or-logon-autostart-execution
      - https://www.microsoft.com/en-us/security/blog/2024/08/28/peach-sandstorm-deploys-new-custom-tickler-malware-in-long-running-intelligence-gathering-operations/
      - https://www.attackiq.com/2024/10/15/emulating-lumma-stealer/
      - https://medium.com/@S3N4T0R/venomous-bear-apt-adversary-simulation-43a22ef9640f
      - https://www.seqrite.com/blog/silent-lynx-apt-targeting-central-asian-entities/
      - https://www.bridewell.com/insights/blogs/detail/who-are-hellcat-ransomware-group
      - https://www.morphisec.com/blog/new-noodlophile-stealer-fake-ai-video-generation-platforms/
      - https://www.cybereason.com/blog/rhadamanthys-stealer-europe
      - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/malicious-screen-connect-campaign-abuses-ai-themed-lures-for-xworm-delivery/
