      - https://www.malwarebytes.com/blog/news/2026/01/can-you-use-too-many-lolbins-to-drop-some-rats
      - https://labs.k7computing.com/index.php/the-pyrat-code-python-based-rat-and-its-internals/
      - https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399
      - https://www.elastic.co/security-labs/badiis-to-the-bone-new-insights-to-global-seo-poisoning-campaign
      - https://isc.sans.edu/diary/rss/32754
      - https://research.checkpoint.com/2026/silver-dragon-targets-organizations-in-southeast-asia-and-europe/
      - https://securityaffairs.com/188895/apt/from-phishing-to-google-drive-c2-silver-dragon-expands-apt41-playbook.html
      - https://www.picussecurity.com/resource/blog/t1059-001-powershell
      - https://www.darkrelay.com/post/apt29-midnight-blizzard-operations-iocs-detection-strategies
      - https://www.zscaler.com/blogs/security-research/middle-east-conflict-fuels-opportunistic-cyber-attacks
      - https://www.welivesecurity.com/en/eset-research/sednit-reloaded-back-trenches/
      - https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx
      - https://www.picussecurity.com/resource/blog/t1547-001-registry-run-keys-startup-folder
      - https://www.picussecurity.com/resource/blog/t1547-004-winlogon-helper
      - https://www.picussecurity.com/resource/blog/t1547-003-time-providers
      - https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
      - https://www.cyfirma.com/research/crysome-rat-an-advanced-persistent-net-remote-access-trojan/
      - https://www.esentire.com/blog/etherrat-sys-info-module-c2-on-ethereum-etherhiding-target-selection-cdn-like-beacons
  tags:
      - attack.persistence
      - attack.t1547.001
  logsource:
      category: process_creation
      product: windows
  detection:
      selection_reg:
          CommandLine|contains|all:
              - 'reg' #reg add hkcu\software\classes\.Admin\shell\runas\command /f /ve /d "cmd /x /d /r set; https://www.picussecurity.com/resource/blog/t1547-001-registry-run-keys-startup-folder
              - 'add'
      selection_aseps_base_chain1:
          CommandLine|contains:
              - 'SOFTWARE' #Software\Microsoft\Windows\CurrentVersion\Run
              - 'Environment' #for coverage Environment\UserInitMprLogonScript in a detection chain.
              - 'System' #SYSTEM\CurrentControlSet\Control\SafeBoot\AlternateShell'
      selection_aseps_base_chain2:
          CommandLine|contains:
              - 'Microsoft' #SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnceEx
              - 'Environment' #for coverage Environment\UserInitMprLogonScript in a detection chain.
              - 'CurrentControlSet' #SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\InitialProgram
              - 'Classes'
      selection_aseps:
          CommandLine|contains:
              - '\Run' #Software\Microsoft\Windows NT\CurrentVersion\Windows\Run; https://labs.k7computing.com/index.php/the-pyrat-code-python-based-rat-and-its-internals/; https://cert.gov.ua/article/6287707; https://www.picussecurity.com/resource/blog/t1059-001-powershell; https://www.zscaler.com/blogs/security-research/middle-east-conflict-fuels-opportunistic-cyber-attacks; https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx; https://www.esentire.com/blog/etherrat-sys-info-module-c2-on-ethereum-etherhiding-target-selection-cdn-like-beacons; https://blog.gdatasoftware.com/2026/04/38409-fake-foxit-vnc; https://labs.infoguard.ch/posts/anatomy_deno_rat/; https://www.security.com/threat-intelligence/node-js-returns-ransomware
              - '\Runonce' #SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce
              - '\RunOnce' #SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce; https://www.cyfirma.com/research/crysome-rat-an-advanced-persistent-net-remote-access-trojan/
              - '\RunonceEx' #SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnceEx
              - '\RunOnceEx' #SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnceEx
              - '\Load' #Software\Microsoft\Windows NT\CurrentVersion\Windows\Load
              - 'UserInitMprLogonScript' #Environment\UserInitMprLogonScript; https://www.malwarebytes.com/blog/news/2026/01/can-you-use-too-many-lolbins-to-drop-some-rats
              - '\Shell' #SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell; https://www.picussecurity.com/resource/blog/t1547-004-winlogon-helper
              - '\Logoff' #Software\Policies\Microsoft\Windows\System\Scripts\Logoff
              - '\Logon' #Software\Policies\Microsoft\Windows\System\Scripts\Logon
              - '\Shutdown' #Software\Microsoft\Windows\CurrentVersion\Group Policy\Scripts\Shutdown
              - '\Startup' #Software\Policies\Microsoft\Windows\System\Scripts\Startup
              - 'AutoStartOnConnect' #SOFTWARE\Microsoft\Windows CE Services\AutoStartOnConnect
              - 'AutoStartOnDisconnect' #SOFTWARE\Microsoft\Windows CE Services\AutoStartOnDisconnect
              - 'IconServiceLib' #Software\Microsoft\Windows NT\CurrentVersion\Windows\IconServiceLib
              - 'AvailableShells' #Software\Microsoft\Windows NT\CurrentVersion\Winlogon\AlternateShells\AvailableShells
              #- '\Installed Components' #SOFTWARE\Microsoft\Active Setup\Installed Components
              - 'AlternateShell' #SYSTEM\CurrentControlSet\Control\SafeBoot\AlternateShell
              - 'StartupPrograms' #System\CurrentControlSet\Control\Terminal Server\Wds\rdpwd\StartupPrograms
              - 'InitialProgram' #SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\InitialProgram
              - '\NetSh' #SOFTWARE\Microsoft\NetSh'
              - 'Autorun' #SOFTWARE\Microsoft\Command Processor\Autorun
              - '\Services' #\SYSTEM\CurrentControlSet\Services\; https://www.huntress.com/blog/active-exploitation-solarwinds-web-help-desk-cve-2025-26399; https://www.elastic.co/security-labs/badiis-to-the-bone-new-insights-to-global-seo-poisoning-campaign; https://research.checkpoint.com/2026/silver-dragon-targets-organizations-in-southeast-asia-and-europe/; https://www.picussecurity.com/resource/blog/t1547-003-time-providers; https://www.splunk.com/en_us/blog/security/blankgrabber-trojan-stealer-analysis-detection.html
              - '\RunServicesOnce'
              - '\RunServices'
              - '\Monitors'
              - 'LegalNoticeText' #CurrentVersion\Winlogon /v LegalNoticeText; https://www.picussecurity.com/resource/blog/t1547-004-winlogon-helper
              - 'DefaultUserName' #CurrentVersion\Winlogon /v DefaultUserName; https://www.picussecurity.com/resource/blog/t1547-004-winlogon-helper
              - 'AutoLogonCount' #CurrentVersion\Winlogon /v AutoLogonCount; https://www.picussecurity.com/resource/blog/t1547-004-winlogon-helper
      selection_service:
          CommandLine|contains: 'ServiceDll' #https://cert.gov.ua/article/6284080; https://security.googlecloudcommunity.com/community-blog-42/finding-malware-dirtybulk-and-friends-usb-infections-to-fuel-cybercriminal-coinmining-operations-5552
      filters:
          - CommandLine|contains:
              - '/d ""' #empty value
              - ':\Program Files'
              - 'UserChoice' #reg  add "HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\https\UserChoice" /v ProgId /t REG_SZ /d ChromeHTML /f
              - 'Discord.exe'
              - 'Discord\Update.exe'
          - CommandLine|contains|all:
              - 'HKEY_CLASSES_ROOT'
              - '\Command' #hardeding stuff
              - 'notepad.exe' #C:\Windows\system32\cmd.exe /c "reg add HKEY_CLASSES_ROOT\VBSFile\Shell\Open2\Command /d "'%SystemRoot%\notepad.exe' '%1' %*" /t REG_SZ /f"
          - ParentImage|endswith:
              - 'Yammer.exe'
              - 'Zalo.exe'
              - '_1st.exe' #PICUS BAS
              - 'Suuntolink.exe'
              - 'Skype.exe'
              - 'Discord.exe'
      condition: ((selection_reg and selection_aseps_base_chain1 and selection_aseps_base_chain2 and selection_aseps) and not filters) or (selection_reg and selection_service)
  falsepositives:
      - Legitimate software activity.
  level: medium
level: medium
