      - https://www.zscaler.com/blogs/security-research/janelarat-repurposed-bx-rat-variant-targeting-latam-fintech
      - https://medium.com/@knownsec404team/analysis-of-the-recent-offensive-operations-conducted-by-north-korean-apt-groups-b5add762859b
      - https://asec.ahnlab.com/en/58919/
