name: Possible Persistence Points [ASEPs - Software/NTUSER Hive] (via cmdline)
body: |-
  title: Possible Persistence Points [ASEPs - Software/NTUSER Hive] (via cmdline)
  id: e596cd9b-b015-4468-9bce-2a9855290c89
  status: stable
  description: Utility REG.EXE can be used to add registry keys for persistences.
  author: SOC Prime Team
  references:
      - https://www.security.com/threat-intelligence/node-js-returns-ransomware
      - https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/
