  author: SOC Prime Team
  tags:
      - attack.initial_access
      - attack.t1566.001
  logsource:
      category: file_event
      product: windows
  detection:
      selection_images:
          Image|endswith:
              - 'WinRAR.exe' # Повідомлення 4726-49.rar CVE-2025-8088 https://www.welivesecurity.com/en/eset-research/gorbag-orcs-border-harvesting-intelligence-ukraine/
              - '7z.exe'
              - 'tar.exe'
              - 'rar.exe'
      selection_ext:
          TargetFilename|endswith:
              - '.library-ms' #CVE-2025-24071; https://medium.com/@mhwee/unmasking-windows-library-files-a-deep-dive-into-client-side-exploitation-6bf3371a5262
              - '.vbs' #https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/; https://asec.ahnlab.com/en/92160/; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html
              - '.js' #https://www.recordedfuture.com/research/graycharlie-hijacks-law-firm-sites-suspected-supply-chain-attack; https://isc.sans.edu/diary/32766; https://cert.gov.ua/article/6315762
              - '.jse'
              - '.bat' #https://asec.ahnlab.com/en/92160/; https://isc.sans.edu/diary/rss/32754
              - '.url'
              - '.cmd' #https://www.sonicwall.com/blog/pdf-borne-living-off-the-land-attacks-with-rmm-abuse; https://cyble.com/blog/professional-networks-under-attack-by-infostealer/
              - '.exe' #https://www.trendmicro.com/en_us/research/25/l/valleyrat-campaign.html; https://asec.ahnlab.com/en/92160/; https://www.picussecurity.com/resource/blog/hunters-international-ransomware; https://www.resecurity.com/blog/article/pdfsider-malware-exploitation-of-dll-side-loading-for-av-and-edr-evasion; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and; https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-gogitter-gitshellpad-and-goshell; https://blog.talosintelligence.com/knife-cutting-the-edge/; https://lab52.io/blog/plugx-meeting-invitation-via-msbuild-and-gdata/; https://sect.iij.ad.jp/blog/2026/02/plugx-executed-via-staticplugin/; https://www.malwarebytes.com/blog/scams/2026/02/huorong; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.threatdown.com/blog/castlerat-cyber-attack-is-the-first-to-abuse-deno-javascript-runtime-to-evade-enterprise-security/; https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx; https://www.mcafee.com/blogs/other-blogs/mcafee-labs/ai-written-malware-vibe-coded-campaign/; https://blog.sekoia.io/silver-fox-the-only-tax-audit-where-the-fine-print-installs-malware/; https://cyble.com/blog/professional-networks-under-attack-by-infostealer/; https://redcanary.com/blog/threat-intelligence/scarlet-goldfinch-clickfix/
              - '.lnk' # Startup LNK from Повідомлення 4726-49.rar https://virusbulletin.com/uploads/pdf/conference/vb2026/papers/Gorbag-Orcs-at-the-border.pdf; https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/; CVE-2025-8088; https://www.mcafee.com/blogs/other-blogs/mcafee-labs/astaroth-banking-trojan-abusing-github-for-resilience/; https://www.picussecurity.com/resource/blog/fog-ransomware-2025-deep-dive-into-ttps; https://www.seqrite.com/blog/9479-2/; https://news.sophos.com/en-us/2025/12/05/sharpening-the-knife-gold-blades-strategic-evolution/; https://cloud.google.com/blog/topics/threat-intelligence/exploiting-critical-winrar-vulnerability?e=48754805; https://www.fortinet.com/blog/threat-research/massive-winos-40-campaigns-target-taiwan; https://cert.gov.ua/article/6287707; https://www.bitdefender.com/en-us/blog/businessinsights/apt36-nightmare-vibeware; https://blog.checkpoint.com/research/china-nexus-activity-against-qatar-observed-amid-expanding-regional-tensions/; https://www.zscaler.com/blogs/security-research/middle-east-conflict-fuels-opportunistic-cyber-attacks; https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx; https://www.proofpoint.com/us/blog/threat-insight/iran-conflict-drives-heightened-espionage-activity-against-middle-east-targets; https://www.seqrite.com/blog/operation-camelclone-multi-region-espionage-campaign-targets-government-and-defense-entities-amidst-regional-tensions/; https://www.genians.co.kr/en/blog/threat_intelligence/kakaotalk; https://www.proofpoint.com/us/blog/threat-insight/id-come-running-back-eu-again-ta416-resumes-european-government-espionage
              - '.hta'
              - '.msc'
              #- '.doc' #old file format which can contain macros.
              - '.iso' #https://news.sophos.com/en-us/2025/12/05/sharpening-the-knife-gold-blades-strategic-evolution/
              - '.img' #https://news.sophos.com/en-us/2025/12/05/sharpening-the-knife-gold-blades-strategic-evolution/
              - '.dll' #https://www.resecurity.com/blog/article/pdfsider-malware-exploitation-of-dll-side-loading-for-av-and-edr-evasion; https://www.esentire.com/blog/weaponized-in-china-deployed-in-india-the-syncfuture-espionage-targeted-campaign; https://blog.talosintelligence.com/knife-cutting-the-edge/; https://www.fortinet.com/blog/threat-research/massive-winos-40-campaigns-target-taiwan; https://research.checkpoint.com/2026/silver-dragon-targets-organizations-in-southeast-asia-and-europe/; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.zscaler.com/blogs/security-research/china-nexus-threat-actor-targets-persian-gulf-region-plugx; https://www.microsoft.com/en-us/security/blog/2026/03/12/storm-2561-uses-seo-poisoning-to-distribute-fake-vpn-clients-for-credential-theft/; https://www.mcafee.com/blogs/other-blogs/mcafee-labs/ai-written-malware-vibe-coded-campaign/; https://blog.sekoia.io/silver-fox-the-only-tax-audit-where-the-fine-print-installs-malware/; https://cyble.com/blog/professional-networks-under-attack-by-infostealer/; https://redcanary.com/blog/threat-intelligence/scarlet-goldfinch-clickfix/
              - '.msi' #https://asec.ahnlab.com/en/92183/; https://www.microsoft.com/en-us/security/blog/2026/03/12/storm-2561-uses-seo-poisoning-to-distribute-fake-vpn-clients-for-credential-theft/
              - '.csproj' #https://lab52.io/blog/plugx-meeting-invitation-via-msbuild-and-gdata/; https://www.proofpoint.com/us/blog/threat-insight/id-come-running-back-eu-again-ta416-resumes-european-government-espionage; https://asec.ahnlab.com/ko/93289/
              - '.tmp' #Rar.exe a –{REDACTED} c:\Windows\temp\DMBC2C61.tmp;
      filters:
          - TargetFilename|contains|all:
              - 'NVIDIA'
              - 'Downloader' #C:\ProgramData\NVIDIA Corporation\Downloader\latest\NvBack...
          - TargetFilename|contains:
              - '\NVIDIA Corporation\'
              - 'UpdatePack7Live' #old systems update
      condition: (selection_images and selection_ext) and not filters
  falsepositives:
      - legitimate files inside archives.
  level: low
level: low
