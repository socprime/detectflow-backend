  tags:
      - attack.defense_evasion
      - attack.execution
      - attack.t1053.005
  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          ParentImage|endswith:
              - '.exe'
              - '.tmp'
              - '.src'
          Image|endswith: 'schtasks.exe'
          CommandLine|contains: 'Create'
      selection_points:
          CommandLine|contains:
              - 'ProgramData' # schtasks /create /sc minute /mo 15 /tr "conhost --headless cmd /c more C:\programdata\talk.log|c^m^d" /tn BiosUpdates\update101 /f https://www.fortinet.com/blog/threat-research/bitter-expands-its-arsenal-with-paprat; scheduled task disguised as OneDrive update -> C:\ProgramData scripts https://asec.ahnlab.com/en/96295/
              - 'Fonts' #schtasks /create /tn "ApphostRagistreationVerifier" /tr "%SystemRoot%\Fonts\ApphostRagistreationVerifier.exe" /sc ONSTART /ru "NT AUTHORITY\SYSTEM" /f
              - '\Users' # schtasks /create /sc minute /mo 30 /tn MicrosoftUpdates\updates11678 /tr "conhost --headless cmd /c more C:\users\public\music\err.log|cmd" /f https://www.fortinet.com/blog/threat-research/bitter-expands-its-arsenal-with-paprat; C:\Users\Admin\AppData\Local; https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns; https://any.run/cybersecurity-blog/major-cyber-attacks-november-2025/; https://isc.sans.edu/diary/rss/32682; https://www.security.com/threat-intelligence/asyncrat-libya-oil-cyberattack; https://cert.gov.ua/article/6288271; https://www.genians.co.kr/en/blog/threat_intelligence/python?hsCtaAttrib=343278473915; https://blog.synapticsystems.de/uac-0247-malware-targeting-fpv-operators/; https://www.genians.co.kr/en/blog/threat_intelligence/narwhalrat; https://www.picussecurity.com/resource/blog/dropping-elephant-patchwork-espionage-apt-tactics-and-tool; https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/; https://www.pointwild.com/threat-intelligence/bothelper-rat-from-encrypted-payload-to-live-screen-surveillance/
              - '\temp' #chtasks /create /sc MINUTE /mo 5 /tn "\Microsoft\Windows\SideShow\SystemDataProvider" /tr "powershell -exec bypass -file C:\Windows\Temp\xpsrchvw.ps1" /ru SYSTEM; https://any.run/cybersecurity-blog/emerging-ransomware-bqtlock-greenblood/; https://www.huntress.com/blog/the-gentlemen-ransomware-defense-evasion-ttps; https://www.microsoft.com/en-us/security/blog/2026/05/26/poisoned-search-results-gpu-mining-cryptojacking-campaign-abusing-screenconnect-microsoft-net-utilities/; https://www.security.com/blog-post/stock-exchange-espionage
              - '$temp' #"$windir\$system32\schtasks.exe" /Create /TN "Updates\aPCyDwLsApDgb" /XML "$user\$temp\tmp8ACB.tmp"
              - '$home' #..$c;schtasks.exe /create /TN OneDriveUpdateCoreFilesStart /SC minute /mo 15 /tr $home\appdata\local\...
              - 'Framework64' #%windir%\Microsoft.NET\Framework64\v4.0.30319\MSBuild %temp%\ChromeConnection" /f...
              - '.js' #schtasks.exe /create /tn OneDriveStandal0ne /tr C:\Users\Public\Libraries\OneDriveUpdate.js /sc minute /mo 3 /f
              - 'MSBuild' #%windir%\Microsoft.NET\Framework64\v4.0.30319\MSBuild %temp%\ChromeConnection" /f...
              - '.xml' #https://cert.gov.ua/article/6287250; https://www.trendmicro.com/en_us/research/26/c/boryptgrab-stealer-targets-users-via-deceptive-github-pages.html; https://www.cyberproof.com/blog/beyond-powershell-analyzing-the-multi-action-clickfix-variant/
              - '.bat' #https://www.genians.co.kr/en/blog/threat_intelligence/kakaotalk; https://cyble.com/blog/professional-networks-under-attack-by-infostealer/; https://www.forescout.com/blog/from-clickfix-to-c2-comparative-analysis-of-two-malware-loaders/
              - '.vbs' # https://www.picussecurity.com/resource/blog/gamaredon-primitive-bear-apt-profile-and-mitre-attck-breakdown
              - '.py'
              - 'vbscript'
              - 'wscript' # https://www.genians.co.kr/en/blog/threat_intelligence/operation-gitpower
              - 'cscript'
              - '.jar'
              - '.au3'
              - 'rundll32' #schtasks /create /sc minute /mo 30 /tn asd /ru system /rl highest /f /tr "CSIDL_SYSTEM\rundll32.exe c:\windows\system32\comsvcs.dll, minidump 1020 c:\users\defautl\out.dmp full"; https://redcanary.com/blog/threat-intelligence/intelligence-insights-july-2025/; https://www.security.com/threat-intelligence/ukraine-russia-attacks; https://www.attackiq.com/2025/11/14/sandworm/; https://asec.ahnlab.com/en/92183/; https://blog.sekoia.io/oysterloader-unmasked-the-multi-stage-evasion-loader/
              - '.com' #https://cert.gov.ua/article/6281681
              - 'PUBLIC' # /tr "cmd /c more C:\users\public\music\err.log|cmd" https://www.fortinet.com/blog/threat-research/bitter-expands-its-arsenal-with-paprat; %PUBLIC% #https://cert.gov.ua/article/6281681
              - '%TMP%' #https://cert.gov.ua/article/6284949
              - 'PerfLog' #schtasks.exe" /create /tn P /xml C:\PerfLog\sch_ha.db /f; https://sect.iij.ad.jp/blog/2026/03/dropbox-api-kimsuky-malware/
      filters:
          - CommandLine|contains:
              - 'SqlServerExtension' #schtasks /create /tn "\Microsoft\SqlServerExtension\SqlServerExtensionPermissionProvider" /xml C:\Windows\TEMP\tmp7714.tmp
              - 'NDIToolsLaunch'
              - '\ClickToRun'
          - ParentImage|endswith:
              - 'msiexec.exe'
              - 'SupportAssistAgent.exe' #for case when parent is binary only
              - 'RtkAudUService64.exe'
              - 'RadeonInstaller.exe'
              - 'InstallManager.exe' # AMD
              - 'AsusOptimization.exe' # Asus
              - 'avira_spotlight_setup_laun.tmp' # Avira
          - ParentImage|contains:
              - '32\driverstore\'
          - ParentImage|contains|all:
              - '\Program'
              - 'Files' #"SCHTASKS.exe" /Create /XML C:\Windows\TEMP\AutoUpdateScheduler.xml /TN "Dell SupportAssistAgent AutoUpdate"
              - 'supportassistagent'
          - ParentImage|contains|all:
              - 'system32' # --> schtasks /create /Tn RtkAudUService64_BG /XML "C:\WINDOWS\TEMP\ST_CPL.pkg.XML" /F
              - 'driverstore'
              - 'filerepository'
      condition: (selection and selection_points) and not filters
  falsepositives:
      - Administrative GPO tasks (rare)
      - Administrative tasks (rare)
  level: medium
level: medium
